[package]
name = "ultrakey-platform"
description = "macOS FFI 경계 — 이 저장소의 모든 unsafe 가 여기에만 있다"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ultrakey-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
# F-10 로그인 항목(login_item.rs) macOS 12 폴백이 쓰는 LaunchAgent plist 직렬화.
# 순수 Rust 라 macOS 여부와 무관하게 빌드·테스트된다 — 타깃별 의존성 절이 아니라
# 여기(공통 [dependencies])에 둔다.
plist = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
block2 = { workspace = true }

# ── F-02 (Seek 텍스트 검출, 이슈 #30) ─────────────────────────────────────
# 기본 기능 전량(objc2-vision 은 63개)을 켜면 빌드가 무거워지므로
# default-features = false 로 두고 실제로 쓰는 헤더만 켠다.
objc2-core-image = { workspace = true, default-features = false, features = [
    "std",
    "CIImage",
    "CIFilter",
    "CIContext",
    "CIVector",
    "objc2-core-graphics",
    "objc2-core-foundation",
] }
objc2-vision = { workspace = true, default-features = false, features = [
    "std",
    "VNTypes",
    "VNRequest",
    "VNRequestHandler",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNGeometry",
    "objc2-core-graphics",
    "objc2-core-image",
    "objc2-core-foundation",
] }
axuielement = { workspace = true }
