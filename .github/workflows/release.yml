# Ultrakey 릴리즈 파이프라인 — 이슈 #50.
#
# 트리거는 `v*` 태그 푸시 단일이다(명시적 버전링).
#   check   태그↔버전 일치 + test + clippy (게이트)
#   build   universal 빌드 + DMG. 서명·공증 시크릿이 있으면 서명+공증+스테이플,
#           없으면 미서명 통과 + 경고(실패하지 않는다)
#   release 직전 릴리즈 태그~현재 태그 커밋 로그를 추출해 드래프트 릴리즈 생성
#
# 서명·공증은 Tauri 번들러가 자체 처리한다(임시 키체인 생성·서명·공증·스테이플).
# 게이트 설계 근거는 docs/dev/code-signing.md §8 과 이슈 #50 계획 코멘트 참조.
name: release

on:
  push:
    tags: ['v*']

jobs:
  check:
    name: tag↔version + test + clippy
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 태그 ↔ 버전 일치 확인
        run: |
          set -euo pipefail
          CONFIG_VERSION="$(jq -r '.version' apps/ultrakey-app/tauri.conf.json)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CONFIG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME} 와 tauri.conf.json version(${CONFIG_VERSION}) 이 다릅니다 — 버전을 먼저 올리고 다시 태그하세요"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          # macos-15 라벨이 arm64 러너로 라우팅되면서, 아키텍처를 키에 넣지 않으면
          # x86_64 캐시가 arm64 러너에 복원돼 build-script 바이너리가 실행 불가(exit 126)가 된다.
          key: ${{ runner.arch }}
      # F-13 — 플러그인이 컴파일 시점에 프레임워크를 요구하므로(없으면 build.rs panic)
      # cargo test/clippy 전에 받아둔다.
      - name: Sparkle 프레임워크 내려받기
        run: ./scripts/fetch-sparkle.sh
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: universal build + DMG (서명 게이트)
    needs: check
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.build.outputs.signed }}
      notarized: ${{ steps.build.outputs.notarized }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          # macos-15 라벨이 arm64 러너로 라우팅되면서, 아키텍처를 키에 넣지 않으면
          # x86_64 캐시가 arm64 러너에 복원돼 build-script 바이너리가 실행 불가(exit 126)가 된다.
          key: ${{ runner.arch }}
      - name: rustup 타깃 추가
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # F-13 — `tauri build` 가 실행하는 플러그인 build.rs(프레임워크 링크)에 필요.
      - name: Sparkle 프레임워크 내려받기
        run: ./scripts/fetch-sparkle.sh
      - name: tauri-cli 설치 (npm 사전 빌드 바이너리)
        run: npm install --global @tauri-apps/cli@2.11.4
      - name: universal 빌드 + DMG (서명 게이트)
        id: build
        # 시크릿 미설정 시 이 매핑은 빈 문자열이 된다 — 아래 가드가 빈 값을
        # 환경에서 제거한다. 게이트 설계 근거: 이슈 #50 계획 코멘트 결정 3.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          NOTARIZED=false
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            NOTARIZED=true
          else
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "::warning::공증 시크릿 미설정/불완전 — 공증 없이 진행합니다"
          fi
          # ⭐ 서명은 Tauri 번들러에게 맡기지 않는다 — Developer ID(.p12)든 자체 서명이든
          # 번들러의 find-identity 신원 해석은 키체인 신뢰 사슬 문제로 실패할 수 있다.
          # 대신 build-signed.sh 와 동일하게 tauri build(번들만) → 명시적 codesign 으로
          # 임시 키체인 안에서 직접 서명한다(Sparkle 중첩 서명 포함).
          SIGNED=false
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ] && [ -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ]; then
            SIGNED=true
            echo "::notice::서명 인증서 감지 — 직접 codesign 으로 서명한다"
          else
            echo "::warning::서명 시크릿 미설정/불완전 — 미서명으로 빌드합니다 (실패 아님)"
          fi
          echo "signed=${SIGNED}" >> "$GITHUB_OUTPUT"
          echo "notarized=${NOTARIZED}" >> "$GITHUB_OUTPUT"
          tauri build --target universal-apple-darwin
          # ── 서명: build-signed.sh 의 방식을 그대로 재현 ──
          if [ "$SIGNED" = "true" ]; then
            KEYCHAIN=ultrakey-sign.keychain-db
            KC_PASS="$(openssl rand -hex 16)"
            security create-keychain -p "$KC_PASS" "$KEYCHAIN"
            security set-keychain-settings -t 900 "$KEYCHAIN"
            security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
            # ⭐ codesign 은 키체인 검색 목록(keychain search list)에서만 신원을 찾는다.
            # 임시 키체인을 만든 채로 두면 login.keychain 만 검색해 "no identity found" 가 난다.
            # 로컬 스크립트는 사용자 키체인에 이미 인증서가 있으므로 이 단계가 필요 없지만,
            # CI 임시 키체인은 새 키체인이라 검색 목록에 명시적으로 등록해야 한다.
            security list-keychains -d user -s "$KEYCHAIN" "$(security list-keychains -d user | tr -d '\"')"
            printf '%s' "${{ secrets.APPLE_CERTIFICATE }}" | base64 -d > /tmp/cert.p12
            CERT_P12_PASS="${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            security import /tmp/cert.p12 -k "$KEYCHAIN" -f pkcs12 -P "$CERT_P12_PASS" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
            printf '%s' "${{ secrets.APPLE_CERTIFICATE }}" | base64 -d > /tmp/cert.b64 2>/dev/null || true
            openssl pkcs12 -in /tmp/cert.p12 -passin "pass:$CERT_P12_PASS" -nokeys -clcerts \
              -out /tmp/cert.pem -passout pass:
            # 파이프라인 중간 실패(pipefail+grep 매칭 없음)가 전체를 조용히 죽이므로
            # set -e 에 걸리지 않는 형태로 신원을 얻는다.
            IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" \
              | awk -F'"' '/"[^"]+"/{print $2; exit}')" || true
            if [ -z "$IDENTITY" ]; then
              echo "::warning::find-identity 가 신원을 반환하지 않음 — 인증서 CN 으로 서명을 시도한다"
              IDENTITY="Ultrakey Dev"
            fi
            echo "::notice::서명 신원: ${IDENTITY}"
            APP_PATH="$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)"
            test -n "$APP_PATH" || { echo "::error::.app 번들을 찾지 못했습니다"; exit 1; }
            ENTITLEMENTS="apps/ultrakey-app/entitlements.plist"
            # 번들 안에 Sparkle.framework 같은 중첩 코드(XPC·헬퍼·프레임워크)가 있으면
            # 안쪽부터 먼저 서명한 뒤 메인을 다시 서명한다(build-signed.sh §3 과 동일).
            if [ -d "${APP_PATH}/Contents/Frameworks" ]; then
              find "${APP_PATH}/Contents/Frameworks" -depth \( -name '*.xpc' -o -name '*.app' -o -name '*.framework' \) -print0 |
                while IFS= read -r -d '' nested; do
                  echo "  서명: ${nested##*/}"
                  codesign --force --options runtime --sign "$IDENTITY" "${nested}"
                done
            fi
            codesign --force --options runtime --entitlements "${ENTITLEMENTS}" \
              --sign "$IDENTITY" "${APP_PATH}"
            codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
            echo "  ✅ 서명 완료: ${APP_PATH}"
            # 번들러가 만든 DMG 는 서명 전 .app 을 담고 있으므로, 서명된 .app 으로 재생성한다.
            DMG_PATH="$(find target/universal-apple-darwin/release/bundle -name '*.dmg' | head -n1)"
            test -n "$DMG_PATH" || { echo "::error::기존 DMG 를 찾지 못했습니다"; exit 1; }
            STAGING="$(mktemp -d)"
            cp -R "${APP_PATH}" "${STAGING}/"
            ln -s /Applications "${STAGING}/Applications"
            rm -f "${DMG_PATH}"
            hdiutil create -volname "Ultrakey" -srcfolder "${STAGING}" -ov -format UDZO "${DMG_PATH}"
            echo "  ✅ 서명된 DMG 재생성: ${DMG_PATH}"
          fi
      - name: DMG 산출물 확인
        run: |
          set -euo pipefail
          test -n "$(find target/universal-apple-darwin/release/bundle -name '*.dmg' | head -n1)" \
            || { echo "::error::DMG 산출물이 없습니다"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: ultrakey-dmg
          path: target/universal-apple-darwin/release/bundle/**/*.dmg

  release:
    name: 드래프트 릴리즈
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 릴리즈 노트 범위(직전 태그~현재) 계산용 전체 이력
      - uses: actions/download-artifact@v8
        with:
          name: ultrakey-dmg
          path: ./dmg-artifact
      - name: 릴리즈 노트 추출 + 드래프트 릴리즈 생성
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 직전 릴리즈 태그 = 현재 태그의 조상 중 최근의 v* 태그.
          # 첫 릴리즈(직전 태그 없음) 는 전체 이력으로 폴백한다.
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          {
            if [ "$SIGNED" != "true" ]; then
              printf '> ⚠️ **미서명 빌드** — 서명·공증 시크릿이 설정되지 않았습니다. 배포 전 서명된 빌드로 교체하세요.\n\n'
            fi
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:'* %s' "${PREV_TAG}..${TAG}"
            else
              git log --no-merges --pretty=format:'* %s'
            fi
            printf '\n'
          } > notes.md
          # 다운로드 아티팩트는 빌드 시점의 `target/.../bundle/` 경로를 보존하지 않는다 —
          # `bundle/` 경로를 가정하지 않고 고정 디렉토리에서 `.dmg` 를 찾는다.
          DMG_PATH="$(find ./dmg-artifact -name '*.dmg' | head -n1)"
          test -n "$DMG_PATH" || { echo "::error::아티팩트 다운로드 후 DMG 를 찾지 못했습니다"; exit 1; }
          gh release create "$TAG" \
            --draft \
            --title "Ultrakey $TAG" \
            --verify-tag \
            --notes-file notes.md \
            "$DMG_PATH"