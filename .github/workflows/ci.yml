# Ultrakey CI — PR 과 main 브랜치 푸시 체크.
# 릴리즈 파이프라인은 release.yml(v* 태그 푸시 전용)로 분리되어 있다. 근거: 이슈 #50.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: test + clippy
    # 워크스페이스가 macOS 전용 FFI(objc2-*, IOKit)를 쓰므로 Linux 러너에서는
    # 컴파일이 성립하지 않는다 — 체크도 macOS 러너에서 돌린다.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          # macos-15 라벨이 arm64 러너로 라우팅되면서, 아키텍처를 키에 넣지 않으면
          # x86_64 캐시가 arm64 러너에 복원돼 build-script 바이너리가 실행 불가(exit 126)가 된다.
          key: ${{ runner.arch }}
      # F-13 — tauri-plugin-sparkle-updater 가 컴파일 시점에 Sparkle.framework 를
      # 요구하므로(없으면 build.rs panic) cargo test/clippy 전에 받아둔다.
      - name: Sparkle 프레임워크 내려받기
        run: ./scripts/fetch-sparkle.sh
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # ⭐ 이슈 #99 — 라이선스 저장소 빌드 분기(명세 §3.5 개정). 위 두 게이트는 기본
      # (파일 저장) 빌드만 보므로, 정식 서명 릴리즈가 쓰는 `keychain-store` 분기도
      # 여기서 컴파일·린트해 릴리즈 태그 푸시 전에 깨진 분기를 잡아낸다.
      - name: cargo check (keychain-store 분기)
        run: cargo check -p ultrakey-app --features keychain-store
      - name: cargo clippy (keychain-store 분기)
        run: cargo clippy -p ultrakey-app --features keychain-store -- -D warnings