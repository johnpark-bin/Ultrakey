  이슈 #16 본문의 SVG 를 그대로 옮긴 것이다. 원본에 딸려 있던 빈 래퍼 `<g>`
  두 개(`SVGRepo_bgCarrier`·`SVGRepo_tracerCarrier`)와 내용 래퍼
  (`SVGRepo_iconCarrier`)만 걷어냈다 — **path 의 `d` 는 한 글자도 바꾸지
  않았다.** 도형을 바꾸는 것은 이슈 #16 이 금지한다.

  색·굵기는 여기서 정하지 않는다. `scripts/generate-icons.sh` 가 이 파일의
  `d` 만 읽어다 크기별 SVG 를 합성하고 `sips` 로 래스터화한다. 근거와 절차는
  docs/dev/icons.md 에 있다.
-->
