[workspace]
resolver = "2"
members = [
    "crates/ultrakey-core",
    "crates/ultrakey-platform",
    "crates/ultrakey-engine",
    "crates/ultrakey-layout",
    "crates/ultrakey-hyperkey",
    "crates/ultrakey-presets",
    "crates/ultrakey-korean",
    "crates/ultrakey-permissions",
    "crates/ultrakey-i18n",
    "crates/ultrakey-seek",
    "crates/ultrakey-overlay",
    "crates/ultrakey-seek-session",
    "apps/ultrakey-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/johnpark-bin/Ultrakey"
# ⭐ 최소 macOS 12.0 (제품 결정 D1). 빌드 산출물의 LSMinimumSystemVersion 은
# apps/ultrakey-app/tauri.conf.json 의 bundle.macOS.minimumSystemVersion 이 소유한다.

[workspace.dependencies]
# 워크스페이스 내부
ultrakey-core        = { path = "crates/ultrakey-core" }
ultrakey-platform    = { path = "crates/ultrakey-platform" }
ultrakey-engine      = { path = "crates/ultrakey-engine" }
ultrakey-layout      = { path = "crates/ultrakey-layout" }
ultrakey-hyperkey    = { path = "crates/ultrakey-hyperkey" }
ultrakey-presets     = { path = "crates/ultrakey-presets" }
ultrakey-korean      = { path = "crates/ultrakey-korean" }
ultrakey-permissions = { path = "crates/ultrakey-permissions" }
ultrakey-i18n        = { path = "crates/ultrakey-i18n" }
ultrakey-seek        = { path = "crates/ultrakey-seek" }
ultrakey-overlay     = { path = "crates/ultrakey-overlay" }
ultrakey-seek-session = { path = "crates/ultrakey-seek-session" }

# 버전은 2026-08-30 crates.io 조회로 검증됨 (docs/spec/platform-constraints.md §6 과 일치)
objc2                   = "0.6.4"
objc2-foundation        = "0.3.2"
objc2-app-kit           = "0.3.2"
objc2-core-foundation   = "0.3.2"
objc2-core-graphics     = "0.3.2"
objc2-io-kit            = "0.3.2"
# F-02 (M3 Seek 텍스트 검출) — 이슈 #30 에서 커버리지 확정.
objc2-core-image        = { version = "0.3.2", default-features = false }
objc2-vision            = { version = "0.3.2", default-features = false }
axuielement             = "0.9.1"
block2                  = "0.6.2"
arc-swap                = "1.9.2"
crossbeam-channel       = "0.5.16"
serde                   = { version = "1.0.229", features = ["derive"] }
serde_json              = "1.0.151"
thiserror               = "2.0.20"
tracing                 = "0.1.44"
tracing-subscriber      = { version = "0.3.23", features = ["env-filter"] }
plist                   = "1.10.0"
# F-01 (M3 Seek 활성화) — 전역 단축키 **등록**(가로채기가 아니다).
# `docs/spec/seek-activation-and-session.md` §6·§7 이 지목한 크레이트다.
global-hotkey           = "0.8.0"
tauri                   = "2.11.5"
tauri-build             = "2.6.3"
tauri-plugin-opener     = "2.5.4"
# F-15 설정 export/import (이슈 #39 Phase 2) — 네이티브 열기/저장 대화상자.
# `tauri ^2.10` 를 요구해 2.11.5 와 호환된다(2026-08-31 crates.io 조회로 검증).
tauri-plugin-dialog     = "2.7.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
