[package]
name = "ultrakey-app"
description = "Ultrakey — Tauri 앱 껍데기. M1 에서는 권한 안내 모달과 배선만."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# ⭐ 이슈 #99 — 라이선스 저장소 빌드 분기(`licensing-and-trial.md` §3.5 개정).
# 기본(OFF): 파일 저장(`~/Library/Application Support/Ultrakey/`) — 개발·자체 서명·
# 미서명 빌드. 키체인 접근 자체가 없어 시스템 로그인 프롬프트가 뜨지 않는다.
# `keychain-store`(ON): 기존 Keychain 저장 — `release.yml` 이 **서명 시크릿이 있을
# 때만** 켠다(정식 Apple 서명 빌드 한정). 켜는 곳: `.github/workflows/release.yml`.
keychain-store = []

[dependencies]
ultrakey-core = { workspace = true }
ultrakey-platform = { workspace = true }
ultrakey-engine = { workspace = true }
# ⭐ F-01 세션 중 키 → 검색어 문자 해석(`apps/ultrakey-app/src/seek.rs`
# `resolve_typed_char`) — 엔진이 부팅 시 채워 두는 `LayoutTable::char_for` 를 쓴다.
ultrakey-layout = { workspace = true }
ultrakey-hyperkey = { workspace = true }
ultrakey-presets = { workspace = true }
ultrakey-korean = { workspace = true }
ultrakey-language-presets = { workspace = true }
ultrakey-permissions = { workspace = true }
ultrakey-i18n = { workspace = true }
ultrakey-seek = { workspace = true }
ultrakey-overlay = { workspace = true }
ultrakey-seek-session = { workspace = true }
# ⭐ F-04(이슈 #44) — 순수 판정은 `ultrakey-click`, unsafe FFI 프리미티브는
# `ultrakey-platform::click_synthesis`. 실 executor(`src/click_executor.rs`)가
# 오케스트레이션(포커스 전환·AX 재조회/press)에 직접 쓰는 건 전부 **기존
# 워크스페이스 의존**뿐이다 — 신규 크레이트 추가 없음(지시 §MUST NOT DO).
ultrakey-click = { workspace = true }
# ⭐ F-12(이슈 #59) — 상태 머신·오프라인 유예·LicenseProvider 추상 계약 순수 로직.
ultrakey-license = { workspace = true }
axuielement = { workspace = true }
objc2-app-kit = { workspace = true }
# ⭐ 이슈 #78 — 트레이(NSStatusItem) 상태 스냅샷 폴링 계측에서
# `NSStatusItem::button(mtm)` 의 `MainThreadMarker` 를 얻는 데 쓴다.
objc2 = { workspace = true }
# ⭐ General 탭 언어 선택(이슈 #39, `localization-and-input-sources.md` §3.1.2-a) —
# `AppState.catalog` 를 재시작 없이 교체하기 위해 쓴다. `ultrakey-engine` 이 이미
# 워크스페이스에 들여온 크레이트라 새로 추가하는 것이 아니다.
arc-swap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# ⭐ F-01 Seek 워커의 신호 채널(`apps/ultrakey-app/src/seek.rs`) — `ultrakey-engine`
# 이 이미 이 버전을 쓴다(탭 스레드 커맨드 채널). 같은 버전을 그대로 쓴다.
crossbeam-channel = { workspace = true }
# F-10 메뉴바(NSStatusItem) — Tauri v2 내장 트레이를 쓴다(`tray-icon` 크레이트를
# 별도로 추가하지 않는다, 위임 지시). `image-png` 는 트레이 아이콘을 32x32.png 에서
# `tauri::image::Image::from_bytes` 로 런타임 디코딩하는 데 필요하다(둘 다 워크스페이스
# 루트가 아니라 이 앱 크레이트의 tauri 항목에만 붙인다).
# ⭐ `macos-private-api` — F-03 오버레이가 요구하는 `transparent: true` 창이
# 이 기능 없이는 만들어지지 않는다(`WebviewWindowBuilder::transparent` 자체가
# 컴파일되지 않는다). App Store 배포와 배타적이지만 이 제품은 애초에 비샌드박스
# 직접 배포다(`code-signing.md`, `platform-constraints.md` §3) — 잃는 것이 없다.
# ⭐ `test` — 이슈 #132 렌더러 수명주기 회귀 테스트용. `tauri::test::mock_app()`
# (MockRuntime) 로 `WebviewOverlayRenderer::hide()` 를 실제 호출해 결함(초기화
# 없음)을 잡는다. 빈 feature — 프로덕션 빌드에 아무 영향이 없다.
tauri = { workspace = true, features = ["tray-icon", "image-png", "macos-private-api", "test"] }
tauri-plugin-opener = { workspace = true }
# ⭐ F-01 활성화 경로 1 — `Toggle Seek with shortcut:`. 명세 §6·§7 이 지목했고,
# `rdev` 는 명시적으로 기각됐다(3년간 릴리스 없음 · 이벤트 소비 제어 제한).
global-hotkey = { workspace = true }
# F-15 §3.4 설정 export/import(이슈 #39 Phase 2) — 네이티브 열기/저장 대화상자.
# ⭐ Rust 쪽에서만 쓴다 — 프런트엔드는 `settings_export`/`settings_import` 커맨드만
# invoke 하고, 대화상자는 이 커맨드들이 Rust API(`DialogExt::dialog().file()`)로
# 직접 연다. 그러면 `capabilities/` 의 ACL 을 건드릴 필요가 없다: ACL 은 웹뷰가
# `plugin:dialog|...` 를 직접 invoke 할 때만 관문 역할을 하고, Rust 코드가 플러그인의
# Rust API 를 호출하는 경로는 그 관문을 거치지 않는다. `settings` 창은 지금도
# `capabilities/overlay.json` 밖의 아무 capability 도 없고(기존 커맨드들이 이미 그
# 상태로 동작한다), 이 크레이트를 더해도 그 상태를 그대로 유지한다.
tauri-plugin-dialog = { workspace = true }

# ⭐ F-13(docs/spec/auto-update.md §7 판정: Rust 바인딩) — Sparkle.framework 를
# 감싸는 커뮤니티 플러그인. macOS 전용이라 타깃 테이블로 선언한다(다른 플랫폼
# 컴파일을 막음). init() 은 인자를 받지 않고 설정은 Info.plist 에서 읽는다.
# 프레임워크는 scripts/fetch-sparkle.sh 가 내려받는다(빌드 전 실행 필수).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-sparkle-updater = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }
