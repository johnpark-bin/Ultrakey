  // ─────────────────────────────────────────────────────────────────────────
  // Keyboards 탭(F-17, per-device-settings.md) — 아직 없는 백엔드 계약을
  // 가정하고 배선한다. `state.perDevice` 가 없으면(다른 세션이 아직 main.rs/
  // crates 쪽을 완성하지 않았을 때) 이 탭 전체가 조용히 아무 일도 하지 않는다
  // — boot()/renderState() 양쪽에서 `if (state.perDevice)` 로 방어한다.
  //
  // 기대하는 계약 모양(정본은 이 브랜치의 CONTRACT.md, 이슈 #31 ②④ 로 확장):
  //   state.perDevice = {
  //     devices: [{ id, name, connected, vendorId, productId }, …],
  //     sourceKeys: [{ value, label }, …],           // 35종, 키캡 각인 — 번역 안 함
  //     destinationCategories: [{ key, labelKey }, …],// 15종, 팝업 <optgroup> 순서 그대로
  //     destinations: [{ value, label, category, verified }, …], // 313종
  //     fnStateIsStandard: true | false | null,       // null = 읽기 실패("알 수 없음")
  //     values: { "perDevice.all.keyRemap.rows": […], "perDevice.<vid>:<pid>.functionKeys.f1": null, … }
  //   }
  // 저장은 기존 settings_set 을 그대로 쓴다. "공통 따름"(=키 삭제)만 새 커맨드
  // settings_unset 을 쓴다(§3.3 — 부재와 JSON null 을 반드시 구별해야 하므로
  // settings_set 에 undefined 를 보내는 방식으로는 표현할 수 없다).
  const KEYBOARDS_FN_KEYS = ["f1","f2","f3","f4","f5","f6","f7","f8","f9","f10","f11","f12"];
  const KEYBOARDS_FOLLOW_COMMON = "__follow_common__";
  const KEYBOARDS_STANDARD_FKEY = "__standard_fkey__";

  let currentDevice = "all";
  let currentPerDevice = null; // 마지막으로 받은 state.perDevice 전체(재렌더용 캐시)

  function keyRemapRowsKey(device) {
    return device === "all" ? "perDevice.all.keyRemap.rows" : `perDevice.${device}.keyRemap.rows`;
  }

  function functionKeyStorageKey(device, fkey) {
    return device === "all" ? `perDevice.all.functionKeys.${fkey}` : `perDevice.${device}.functionKeys.${fkey}`;
  }

  async function commitUnset(key) {
    try {
      const state = await invoke("settings_unset", { key });
      renderState(state);
    } catch (err) {
      showFatal("Failed to save setting: " + String(err));
    }
  }

  // ⭐ 이슈 #31 ④ — 디바이스 선택 좌측 패인(§3.1.2 표, Karabiner 식 배치로
  // 재설계). 순서: ① For all devices ② 연결된 키보드(제품명, 번역 안 함 —
  // 고유명사) ③ 미연결 키보드(제품명 + notConnectedSuffix). 각 항목은 제품명 +
  // `[VID: …, PID: …]` 서브라벨(십진 — 참고 스크린샷 그대로, VID/PID 라벨
  // 자체는 고유명사라 번역하지 않는다). `role="listbox"`/`role="option"` +
  // `aria-selected` 로 접근성을 맞춘다 — 방향키 이동·클릭 선택은 아래 리스너.
  function buildDeviceOption(id, name, device) {
    const opt = document.createElement("div");
    opt.setAttribute("role", "option");
    opt.dataset.deviceId = id;
    opt.tabIndex = -1;

    const nameEl = document.createElement("span");
    nameEl.className = "device-name";
    nameEl.textContent = name;
    opt.append(nameEl);

    // "For all devices" 에는 VID/PID 가 없다(device === null) — 서브라벨 자체를
    // 만들지 않는다(② 숨김 패턴).
    if (device) {
      const idsEl = document.createElement("span");
      idsEl.className = "device-ids";
      idsEl.textContent = `[VID: ${device.vendorId}, PID: ${device.productId}]`;
      opt.append(idsEl);
    }
    return opt;
  }

  function highlightSelectedDevice() {
    const options = $("keyboards-device-list").querySelectorAll('[role="option"]');
    for (const o of options) {
      const selected = o.dataset.deviceId === currentDevice;
      o.setAttribute("aria-selected", String(selected));
      o.tabIndex = selected ? 0 : -1;
    }
  }

  function populateDeviceList(devices) {
    const host = $("keyboards-device-list");
    host.innerHTML = "";
    host.append(buildDeviceOption("all", t("preferences.keyboards.devicePicker.forAllDevices"), null));

    const connected = devices.filter((d) => d.connected);
    const disconnected = devices.filter((d) => !d.connected);
    for (const d of connected) {
      host.append(buildDeviceOption(d.id, d.name, d));
    }
    for (const d of disconnected) {
      const label = `${d.name} ${t("preferences.keyboards.devicePicker.notConnectedSuffix")}`;
      host.append(buildDeviceOption(d.id, label, d));
    }

    // 선택했던 디바이스가 목록에서 사라졌으면(이론상 일어나지 않는다 — 설정은
    // 삭제되지 않으므로, §5 엣지 1) "For all devices" 로 되돌린다.
    const stillExists = Array.from(host.querySelectorAll('[role="option"]')).some(
      (o) => o.dataset.deviceId === currentDevice
    );
    if (!stillExists) currentDevice = "all";
    highlightSelectedDevice();
  }

  function selectDevice(id) {
    currentDevice = id;
    highlightSelectedDevice();
    if (currentPerDevice) {
      // ⭐ 이슈 #69 K1 — 패인 선택이 바뀌면 컨텍스트 헤더도 함께 갈린다.
      renderKeyboardsContextHeader(currentPerDevice, currentDevice);
      renderKeyRemapGroup(currentPerDevice, currentDevice);
      renderFunctionKeysGroup(currentPerDevice, currentDevice);
    }
  }

  // ⭐ 이슈 #69 K1 — 컨텍스트 헤더. 우측 패인이 지금 어느 대상의 설정을
  // 보여 주는지 패인 최상단에 고정 표시한다. 공통 계층이면 `For all devices`
  // 카탈로그 문구를, 디바이스면 제품명(고유명사 — 번역하지 않는다,
  // populateDeviceList 의 같은 규약)을 그대로 쓴다.
  function renderKeyboardsContextHeader(perDevice, device) {
    let name;
    if (device === "all") {
      name = t("preferences.keyboards.devicePicker.forAllDevices");
    } else {
      const d = perDevice.devices.find((d) => d.id === device);
      name = d ? d.name : device;
    }
    $("keyboards-context-header").textContent = name;
  }

  // macOS Function Keys 상태 표시줄(§3.5.1) — 읽기 전용. 우리는 이 값을 쓰지 않는다.
  function renderMacosFnStateBadge(fnStateIsStandard) {
    const badge = $("keyboards-fnstate-badge");
    if (fnStateIsStandard === null || fnStateIsStandard === undefined) {
      badge.textContent = t("preferences.keyboards.functionKeys.macosStatus.unknown");
    } else if (fnStateIsStandard) {
      badge.textContent = t("preferences.keyboards.functionKeys.macosStatus.on");
    } else {
      badge.textContent = t("preferences.keyboards.functionKeys.macosStatus.off");
    }
  }

  // ⭐ 이슈 #31 ③(b) — 사용자가 **시스템 설정 앱에서** 토글을 바꾼 것은 우리
  // 쪽에 아무 일도 일으키지 않는다. `state.perDevice.fnStateIsStandard` 는
  // 설정을 건드릴 때만 갱신되므로, 그것만 보면 앱을 켠 시점의 값이 계속 남는다
  // (사용자 보고: "그래서 항상 on 으로 표현되는 것 같거든").
  //
  // ⚠️ 변경 알림이 아니라 **폴링**이다 — macOS 가 이 값의 변경을 알려 주는 공개
  // 알림을 확인하지 못했다(Rust 쪽 `keyboard_fn_state` 주석에 근거). Karabiner
  // 도 같은 값을 3초 주기로 폴링한다. 비용은 IOKit 프로퍼티 1회 읽기라 작지만,
  // 그래도 **Keyboards 탭이 실제로 보일 때만** 돈다.
  const FN_STATE_POLL_MS = 3000;
  let fnStatePollTimer = null;

  async function refreshMacosFnStateBadge() {
    try {
      const value = await invoke("keyboard_fn_state");
      // 캐시도 함께 갱신한다 — 다음 renderState 가 옛 값으로 되돌리지 않도록.
      if (currentPerDevice) currentPerDevice.fnStateIsStandard = value ?? null;
      renderMacosFnStateBadge(value ?? null);
    } catch (err) {
      // 읽기 실패는 치명적이지 않다 — 배지만 "알 수 없음"으로 두고 넘어간다.
      renderMacosFnStateBadge(null);
    }
  }

  function syncFnStatePolling() {
    // 창이 숨겨져 있으면(메뉴바 앱이라 설정 창은 자주 닫힌다) 폴링을 멈춘다.
    const shouldPoll = activeTab === "keyboards" && !document.hidden;
    if (shouldPoll && fnStatePollTimer === null) {
      refreshMacosFnStateBadge();
      fnStatePollTimer = setInterval(refreshMacosFnStateBadge, FN_STATE_POLL_MS);
    } else if (!shouldPoll && fnStatePollTimer !== null) {
      clearInterval(fnStatePollTimer);
      fnStatePollTimer = null;
    }
  }

  // 창이 다시 보이거나 포커스를 되찾는 순간은 "사용자가 방금 시스템 설정에서
  // 돌아왔다"일 가능성이 가장 높은 시점이다 — 폴링 주기를 기다리지 않고 즉시
  // 다시 읽는다.
  document.addEventListener("visibilitychange", syncFnStatePolling);
  window.addEventListener("focus", () => {
    if (activeTab === "keyboards") refreshMacosFnStateBadge();
  });

  // 기능 1 — 가변 길이 목록 편집기(§3.4.1). from/to 팝업에 빈 행 전용 자리표시
  // 옵션(value="")을 하나 앞세운다 — sourceKeys 35종에는 원래 빈 항목이 없어서,
  // "아직 고르지 않음" 상태를 표현하려면 이 팝업만의 추가 옵션이 필요하다.
  function buildSourceKeySelectWithPlaceholder(sourceKeys, selected) {
    const select = document.createElement("select");
    select.dataset.role = "keyremap-key";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "—";
    select.append(placeholder);
    for (const sk of sourceKeys) {
      const opt = document.createElement("option");
      opt.value = sk.value;
      // ⭐ 키캡 각인은 번역하지 않는다(populateSourceSelects 의 같은 규약).
      opt.textContent = sk.label;
      select.append(opt);
    }
    select.value = selected || "";
    return select;
  }

  function buildKeyRemapRow(sourceKeys, fromVal, toVal) {
    const wrapper = document.createElement("div");
    wrapper.className = "keyremap-row-wrapper";

    const row = document.createElement("div");
    // ⚠️ 공백이 든 className 문자열 리터럴은 하드코딩 영어 문장 탐지기(공백 포함
    // 큰따옴표 리터럴을 전부 문장으로 간주)에 걸린다 — classList.add 로 토큰을
    // 나눠 넣어 그 오탐을 피한다.
    row.classList.add("row", "keyremap-row");

    const fromSelect = buildSourceKeySelectWithPlaceholder(sourceKeys, fromVal);
    fromSelect.dataset.role = "from";

    const arrow = document.createElement("span");
    arrow.textContent = "→";

    const toSelect = buildSourceKeySelectWithPlaceholder(sourceKeys, toVal);
    toSelect.dataset.role = "to";

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "keyremap-row-remove";
    removeBtn.textContent = "×";
    removeBtn.addEventListener("click", () => {
      wrapper.remove();
      saveKeyRemapRows();
    });

    row.append(fromSelect, arrow, toSelect, removeBtn);
    wrapper.append(row);
    return wrapper;
  }

  // ① dimmed — 목록 끝에 미완성(from/to 미선택) 행이 있는 동안 추가 버튼을 잠근다.
  function refreshKeyRemapAddButtonState() {
    const wrappers = $("keyboards-keyremap-list").querySelectorAll(".keyremap-row-wrapper");
    let hasEmpty = false;
    for (const w of wrappers) {
      const from = w.querySelector('[data-role="from"]').value;
      const to = w.querySelector('[data-role="to"]').value;
      if (!from || !to) hasEmpty = true;
    }
    $("keyboards-keyremap-add-btn").disabled = hasEmpty;
  }

  // 같은 `from` 을 요구하는 완성된 행이 둘 이상이면 그 행 옆에 경고를 보인다
  // (§3.4 중복 검증 — 대화상자 배선은 백엔드 담당, 여기서는 표시만 한다).
  function renderKeyRemapDuplicateWarnings() {
    const wrappers = Array.from($("keyboards-keyremap-list").querySelectorAll(".keyremap-row-wrapper"));
    const completedFroms = wrappers
      .map((w) => w.querySelector('[data-role="from"]').value)
      .filter((v) => v !== "");
    const seen = new Set();
    const dup = new Set();
    for (const f of completedFroms) {
      if (seen.has(f)) dup.add(f);
      seen.add(f);
    }
    for (const w of wrappers) {
      const from = w.querySelector('[data-role="from"]').value;
      let warn = w.querySelector(".keyremap-row-warning");
      if (from && dup.has(from)) {
        if (!warn) {
          warn = document.createElement("p");
          warn.classList.add("warn", "keyremap-row-warning");
          w.append(warn);
        }
        warn.textContent = t("preferences.keyboards.keyRemap.duplicateFromWarning");
      } else if (warn) {
        warn.remove();
      }
    }
  }

  function collectCompletedKeyRemapRows() {
    const wrappers = $("keyboards-keyremap-list").querySelectorAll(".keyremap-row-wrapper");
    const rows = [];
    for (const w of wrappers) {
      const from = w.querySelector('[data-role="from"]').value;
      const to = w.querySelector('[data-role="to"]').value;
      // ⚠️ 빈 행(from/to 미선택)은 저장하지 않는다(§3.4.1 항목 4의 경고).
      if (from && to) rows.push({ from, to });
    }
    return rows;
  }

  // 두 행 목록이 완전히 같은지(순서 포함). 이슈 #31 의 저장/재렌더 억제 판정에 쓴다.
  function keyRemapRowsEqual(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i += 1) {
      if (a[i].from !== b[i].from || a[i].to !== b[i].to) return false;
    }
    return true;
  }

  // 행 추가·삭제·from/to 변경 각각이 저장 1회다(§3.4.1 항목 4). 저장 값은
  // "행 하나"가 아니라 그 대상의 rows 배열 전체다. 0행이 되는 시점에는
  // 배열(`[]`)이 아니라 `null` 을 쓴다 — §3.3 이 기능 1/2 의 "끔"을 `null` 로
  // 통일하기로 확정했기 때문이다(빈 배열과 null 을 UI 상 구분하지 않는다).
  //
  // ⭐ 이슈 #31 ① — **완성된 행 집합이 그대로면 저장하지 않는다.**
  // 미완성 행(from 만 골랐고 to 는 아직)은 §3.4.1 4항에 따라 저장 대상이 아니다.
  // 그런데 예전 구현은 그 변경에도 `commit()` 을 불렀고, `commit()` 은 응답으로
  // 받은 상태로 화면 전체를 다시 그린다 — 그때 저장소에 없는 미완성 행이 DOM 에서
  // 사라졌다. 두 번째 행을 만들려고 `from` 을 고르는 순간 그 행이 없어지므로,
  // 사용자는 `left_option → left_command` 다음에 역방향 행을 **끝까지 만들 수가
  // 없었다**(사용자 보고: "레프트 커맨드를 시작점에 있는 키로 등록만 하면 무조건
  // 다 삭제가 발생하네"). 저장할 것이 없으면 저장하지 않는 것으로 그 경로를 끊는다.
  function saveKeyRemapRows() {
    refreshKeyRemapAddButtonState();
    renderKeyRemapDuplicateWarnings();
    if (!currentPerDevice) return;
    const key = keyRemapRowsKey(currentDevice);
    const rows = collectCompletedKeyRemapRows();
    const hadKey = Object.prototype.hasOwnProperty.call(currentPerDevice.values, key);
    // ⭐ 이슈 #31 ① — 저장소에 이미 들어 있는 것과 완성된 행 집합이 같으면 아무
    // 것도 하지 않는다. `hadKey` 를 함께 보는 이유: 디바이스 계층 키가 아직
    // **부재**(공통을 물려받는 중)면 같은 배열이라도 "이 디바이스 전용으로 굳히는"
    // 저장이 실제로 필요하기 때문이다(§3.4).
    if (hadKey && keyRemapRowsEqual(rows, currentPerDevice.values[key] || [])) {
      return;
    }
    if (rows.length > 0) {
      // 물려받은 목록을 편집한 경우도 여기로 온다 — 화면에 보이던 행 전체가
      // 그대로 이 디바이스 전용 배열로 굳는다(§3.4, 병합하지 않는다).
      commit(key, rows);
      return;
    }
    // ⭐ 이슈 #31 ① 세 번째 방어선 — **편집 중인 행이 남아 있으면 끄지 않는다.**
    // 완성된 행이 0개라도 화면에 행이 남아 있으면 그것은 "이 디바이스의 변환을
    // 껐다"가 아니라 "지금 고르는 중"이다. 예전 구현은 이 둘을 구별하지 않아,
    // 완성된 행 하나짜리 목록에서 `to` 를 `—` 로 되돌려 **다시 고르려고만 해도**
    // 그 순간 `null`(=전부 끔)이 저장되고 행이 화면에서 사라졌다. 사용자가 본
    // "무조건 다 삭제"의 가장 파괴적인 경로가 이것이다.
    // 끄는 수단은 그대로 남아 있다 — 행을 × 로 전부 지우면 화면에 행이 하나도
    // 없게 되어 아래 `null` 저장으로 간다(§2 시나리오 D 의 진입점).
    const domRowCount = $("keyboards-keyremap-list").querySelectorAll(".keyremap-row-wrapper").length;
    if (domRowCount > 0) return;

    // 0행이 됐다. `[]` 가 아니라 `null`(명시적 끔)을 쓴다 — §3.3 이 기능 1/2 의
    // "끔"을 `null` 로 통일하기로 확정했다.
    // ⭐ 시나리오 D 의 진입점이 바로 여기다: 공통 계층에서 물려받은 행을 이
    // 디바이스에서 전부 지우면 `null` 이 저장되어, 공통 목록은 그대로 둔 채
    // 이 디바이스에서만 꺼진다.
    const commonHasRows =
      currentDevice !== "all" && resolveKeyRemapRows(currentPerDevice, "all").rows.length > 0;
    if (hadKey || commonHasRows) {
      commit(key, null);
    }
    // 디바이스 키도 없고 공통도 비어 있다 — 끌 것이 없으므로 아무것도 저장하지
    // 않는다(F-15 "한 번이라도 건드린 항목만 저장").
  }

  // ⭐ 3상태 해석(§3.3) — 기능 1 도 기능 2 와 똑같이 "디바이스 키 → 공통 키 →
  // 부재" 순으로 읽는다. 디바이스 계층이 **부재**면 공통 계층의 행이 실제로
  // 적용되고 있으므로 **그것을 보여준다.** 빈 목록을 보여주면 두 가지가 깨진다:
  //   ① 사용자가 이 키보드에 실제로 걸려 있는 변환을 볼 수 없다.
  //   ② 명세 §2 시나리오 D("공통은 켜 두고 이 디바이스만 끈다")의 진입점이
  //      사라진다 — 지울 행이 화면에 없으면 끌 방법이 없다.
  // 반환: { rows, inherited } — `inherited` 는 지금 보이는 행이 공통 계층에서
  // 물려받은 것인지(= 디바이스 키가 아직 없는지)를 뜻한다.
  function resolveKeyRemapRows(perDevice, device) {
    const deviceKey = keyRemapRowsKey(device);
    if (Object.prototype.hasOwnProperty.call(perDevice.values, deviceKey)) {
      const raw = perDevice.values[deviceKey];
      // `null` = 명시적 끔(§3.3). 공통을 따르지 않는다.
      return { rows: raw === null ? [] : raw, inherited: false };
    }
    if (device === "all") return { rows: [], inherited: false };
    const commonKey = keyRemapRowsKey("all");
    if (Object.prototype.hasOwnProperty.call(perDevice.values, commonKey)) {
      const raw = perDevice.values[commonKey];
      return { rows: raw === null ? [] : raw, inherited: true };
    }
    return { rows: [], inherited: true };
  }

  // 지금 DOM 에 그려져 있는 목록이 어느 디바이스 것인지 — `renderKeyRemapGroup` 이
  // 목록을 다시 만들어야 하는지 판정하는 데 쓴다(이슈 #31 ②).
  let keyRemapRenderedDevice = null;

  function renderKeyRemapGroup(perDevice, device) {
    const list = $("keyboards-keyremap-list");
    const { rows, inherited } = resolveKeyRemapRows(perDevice, device);

    // ⭐ 이슈 #31 ② — **편집 중인 미완성 행을 재렌더로 지우지 않는다.**
    // `commit()` 은 저장 응답으로 화면 전체를 다시 그린다. 예전 구현은 그때마다
    // 목록 DOM 을 통째로 새로 만들었고, 저장 대상이 아닌 미완성 행(from 만 고른
    // 상태)이 그 자리에서 사라졌다. 같은 디바이스를 보고 있고 저장소의 행 집합이
    // 화면의 **완성된** 행 집합과 이미 같다면 다시 만들 이유가 없다 — 우리가 방금
    // 쓴 값이 그대로 돌아온 것이기 때문이다. 다른 디바이스로 바꿨거나 저장소 쪽이
    // 실제로 달라졌을 때만(외부 변경·되돌리기) 목록을 새로 만든다.
    const sameDevice = keyRemapRenderedDevice === device;
    if (!sameDevice || !keyRemapRowsEqual(collectCompletedKeyRemapRows(), rows)) {
      list.innerHTML = "";
      for (const row of rows) {
        list.append(buildKeyRemapRow(perDevice.sourceKeys, row.from, row.to));
      }
      keyRemapRenderedDevice = device;
    }
    // 빈 목록 안내는 저장된 행이 아니라 **화면에 실제로 있는 행** 기준이다 —
    // 편집 중인 미완성 행이 한 줄이라도 있으면 목록은 비어 있지 않다.
    const domRowCount = list.querySelectorAll(".keyremap-row-wrapper").length;
    $("keyboards-keyremap-empty").hidden = domRowCount > 0;
    // 물려받은 행을 보여주는 중이라는 것을 알린다 — 아무 행이나 건드리는 순간
    // 이 디바이스 전용 목록으로 굳는다(§3.4 "디바이스별 배열이 있으면 공통
    // 배열을 완전히 대체한다").
    $("keyboards-keyremap-inherited").hidden = !(inherited && rows.length > 0);
    refreshKeyRemapAddButtonState();
    renderKeyRemapDuplicateWarnings();
    // ⭐ 이슈 #46 — 상태 뱃지 3상태 + 복사 버튼 활성/숨김 + 복귀 버튼 ② 숨김.
    renderKeyRemapStatusBadge(perDevice, device);
    renderKeyRemapCopyControls(perDevice, device);
  }

  // ⭐ 이슈 #46 — 복사 원천 판정. 기능 1: 공통 `keyRemap.rows` 가 명시적 **비어
  // 있지 않은 배열**일 때만 복사할 것이 있다(부재·null(끔)·빈 배열은 복사 불가).
  function commonKeyRemapHasRows(perDevice) {
    const v = perDevice.values[keyRemapRowsKey("all")];
    return Array.isArray(v) && v.length > 0;
  }

  // 기능 2: 공통 계층에 명시적 목적지 id 문자열(Value)인 F-키가 1개 이상일 때만
  // 복사할 것이 있다(공통의 null·부재 키는 복사하지 않는다 — 희소 복사, 계획 D3).
  function commonFunctionKeysHasValue(perDevice) {
    return KEYBOARDS_FN_KEYS.some((fk) => {
      const v = perDevice.values[functionKeyStorageKey("all", fk)];
      return typeof v === "string" && v.length > 0;
    });
  }

  // ⭐ 이슈 #46 — 기능 1 그룹 상태 뱃지 3상태(③ inline). 디바이스 키 부재 =
  // 상속, 값 존재 = 오버라이드, null = 끔(§3.3). 'For all devices' 선택 중에는
  // 공통 계층에 상태 개념이 없으므로 숨긴다. 기존 keyRemap-inherited 힌트(편집
  // 시 물질화 설명)와 역할이 다르다 — 뱃지는 압축 상태 라벨일 뿐이다.
  // ⭐ 이슈 #69 K1 — 뱃지에 소속 강도 클래스를 더한다: 상속 중은 옅게
  // (state-inherited), 이 키보드 전용 값이 있으면 굵게(state-override).
  // 끔(null)도 디바이스 계층의 명시적 상태라 override 쪽 강도를 쓴다.
  function setKeyboardsStatusBadge(badge, textKey, override) {
    badge.textContent = t(textKey);
    badge.hidden = false;
    badge.classList.remove("state-inherited", "state-override");
    badge.classList.add(override ? "state-override" : "state-inherited");
  }

  function renderKeyRemapStatusBadge(perDevice, device) {
    const badge = $("keyboards-keyremap-status-badge");
    if (device === "all") {
      badge.hidden = true;
      return;
    }
    const key = keyRemapRowsKey(device);
    const hasKey = Object.prototype.hasOwnProperty.call(perDevice.values, key);
    if (!hasKey) {
      setKeyboardsStatusBadge(badge, "preferences.keyboards.status.inherited", false);
    } else if (perDevice.values[key] === null) {
      setKeyboardsStatusBadge(badge, "preferences.keyboards.status.off", true);
    } else {
      setKeyboardsStatusBadge(badge, "preferences.keyboards.status.override", true);
    }
  }

  // ⭐ 이슈 #69 K1-2 — 기능 2 그룹 소속 뱃지. F-키 12개가 각각 3상태(부재=상속 /
  // 문자열=전용 / null=끔)라 그룹 단위로는 4상태로 단순화한다:
  //   공통 Value 키 중 상속 중이 ≥1 이고 전용 키가 0      → 상속됨(옅게)
  //   전용 키(문자열 또는 null)가 1~11                    → 일부 전용(굵게)
  //   전용 키가 12 전부                                    → 이 키보드 전용 설정(굵게)
  //   공통에 Value 인 F-키가 0(복사 원천 없음)             → 숨김(상태 개념 성립 안 함)
  //   'For all devices' 선택 중                            → 숨김(§3.7.3, 기능 1 뱃지와 같음)
  // null(표준 F-키로 끔)도 §3.3 기준 명시적 디바이스 값이므로 "전용"에 센다.
  function renderFunctionKeysStatusBadge(perDevice, device) {
    const badge = $("keyboards-functionkeys-status-badge");
    if (device === "all") {
      badge.hidden = true;
      return;
    }
    const commonHasValue = commonFunctionKeysHasValue(perDevice);
    if (!commonHasValue) {
      badge.hidden = true;
      return;
    }
    let inheritedCount = 0;
    let overrideCount = 0;
    for (const fk of KEYBOARDS_FN_KEYS) {
      const deviceKey = functionKeyStorageKey(device, fk);
      if (Object.prototype.hasOwnProperty.call(perDevice.values, deviceKey)) {
        overrideCount += 1;
      } else {
        inheritedCount += 1;
      }
    }
    if (overrideCount === 0) {
      setKeyboardsStatusBadge(badge, "preferences.keyboards.status.inherited", false);
    } else if (inheritedCount > 0) {
      setKeyboardsStatusBadge(badge, "preferences.keyboards.status.mixed", true);
    } else {
      setKeyboardsStatusBadge(badge, "preferences.keyboards.status.override", true);
    }
  }

  // ⭐ 이슈 #46 — 기능 1 복사/복귀 버튼 상태.
  // 복사 버튼: 'For all devices' 선택 중에는 ② 숨김(공통 위에 복사 원천이 없다),
  // 그 외에는 복사할 것이 있을 때만 ① dimmed 해제.
  // 복귀 버튼: ② 숨김 — 디바이스 계층에 rows 키가 존재할 때만(부재 = 이미
  // 상속 중이라 되돌릴 대상이 없다, 계획 D4).
  function renderKeyRemapCopyControls(perDevice, device) {
    const copyBtn = $("keyboards-keyremap-copy-btn");
    const revertBtn = $("keyboards-keyremap-revert-btn");
    if (device === "all") {
      copyBtn.hidden = true;
      copyBtn.disabled = true;
      revertBtn.hidden = true;
      return;
    }
    copyBtn.hidden = false;
    copyBtn.disabled = !commonKeyRemapHasRows(perDevice);
    const hasDeviceKey = Object.prototype.hasOwnProperty.call(
      perDevice.values,
      keyRemapRowsKey(device)
    );
    revertBtn.hidden = !hasDeviceKey;
  }

  // ⭐ 이슈 #46 — 기능 2 복사 버튼 상태. 기능 1 과 같은 규칙.
  function renderFunctionKeysCopyControl(perDevice, device) {
    const copyBtn = $("keyboards-functionkeys-copy-btn");
    if (device === "all") {
      copyBtn.hidden = true;
      copyBtn.disabled = true;
      return;
    }
    copyBtn.hidden = false;
    copyBtn.disabled = !commonFunctionKeysHasValue(perDevice);
  }

  // ⭐ 이슈 #69 K2 — 기능 2 상속 복귀 버튼(② 숨김). 디바이스 계층에
  // functionKeys.f1~f12 명시적 키(문자열=전용 또는 null=끔)가 1개 이상 있을
  // 때만 표시한다 — 전부 부재(이미 상속 중)면 되돌릴 대상이 없다(§3.7.2 의
  // 기능 1 버튼과 같은 규약). 'For all devices' 선택 중에도 숨긴다.
  function renderFunctionKeysRevertControl(perDevice, device) {
    const revertBtn = $("keyboards-functionkeys-revert-btn");
    if (device === "all") {
      revertBtn.hidden = true;
      return;
    }
    const hasAnyDeviceKey = KEYBOARDS_FN_KEYS.some((fk) =>
      Object.prototype.hasOwnProperty.call(
        perDevice.values,
        functionKeyStorageKey(device, fk)
      )
    );
    revertBtn.hidden = !hasAnyDeviceKey;
  }

  // ⭐ 이슈 #69 K4 — Function Keys 템플릿 2종. 사전 정의된 세트를 이 디바이스
  // 계층의 F-키 12개 저장 키에 기록한다(새 저장 키 없음 — §3.7 원칙).
  //   macMediaKeys : 맥 내장 키보드의 F1~F12 각인 어휘를 destinations 카탈로그
  //                  id 로 조인한 세트. 밝기·Mission Control·Launchpad 는 벤더
  //                  page 목적지라 적용 후 동작 미확인 힌트가 그대로 뜬다
  //                  (§3.1.3 (c) — "빼기가 아니라 알리기"). 미디어 계열은
  //                  실측(Measured) 등급이다.
  //   standardFKeys: F1~F12 전부 null(명시적 끔 = 표준 F-키, §3.5 선택지) —
  //                  시나리오 D("이 디바이스만 끈다")의 F-키 전체 판본.
  const FUNCTION_KEY_TEMPLATES = {
    macMediaKeys: {
      f1: "appleKeyboard.brightness_down",
      f2: "appleKeyboard.brightness_up",
      f3: "appleKeyboard.mission_control",
      f4: "appleKeyboard.launchpad",
      f5: "consumer.rewind",
      f6: "consumer.play_or_pause",
      f7: "consumer.scan_previous_track",
      f8: "consumer.scan_next_track",
      f9: "consumer.mute",
      f10: "consumer.volume_decrement",
      f11: "consumer.volume_increment",
      f12: "consumer.eject",
    },
    standardFKeys: {
      f1: null, f2: null, f3: null, f4: null, f5: null, f6: null,
      f7: null, f8: null, f9: null, f10: null, f11: null, f12: null,
    },
  };

  function populateFunctionKeyTemplates() {
    const select = $("keyboards-functionkeys-template-select");
    select.innerHTML = "";
    for (const [value, labelKey] of [
      ["macMediaKeys", "preferences.keyboards.functionKeys.templates.macMediaKeys"],
      ["standardFKeys", "preferences.keyboards.functionKeys.templates.standardFKeys"],
    ]) {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = t(labelKey);
      select.append(opt);
    }
  }

  // 템플릿 적용이 현재 선택 대상(디바이스 또는 공통)의 기존 값을 실제로
  // 바꾸는가(§3.7.1 의 copyNeedsConfirm 과 동일 판정). 키가 부재(상속 중)인 키는
  // 템플릿이 물질화하는 대상이라 "바꾼다"에 센다 — 상속 값을 갈아치우는 것이므로.
  // ⭐ 이슈 #94 — 공통 계층("모든 키보드")에서도 같은 판정을 한다. 공통 키 부재 +
  // 표준 F-키(null)는 "부재 = 기본값"(F-15)이라 변화가 없다 → 확인 대상이 아니다.
  function templateNeedsConfirm(template) {
    if (!currentPerDevice) return false;
    for (const fk of KEYBOARDS_FN_KEYS) {
      const deviceKey = functionKeyStorageKey(currentDevice, fk);
      const wanted = template[fk];
      if (!Object.prototype.hasOwnProperty.call(currentPerDevice.values, deviceKey)) {
        if (wanted !== null) return true;
        continue;
      }
      if (currentPerDevice.values[deviceKey] !== wanted) return true;
    }
    return false;
  }

  let pendingTemplate = null;

  async function applyFunctionKeyTemplate(templateName) {
    const template = FUNCTION_KEY_TEMPLATES[templateName];
    if (!template || !currentPerDevice) return;
    if (templateNeedsConfirm(template)) {
      pendingTemplate = { templateName };
      // ⭐ 이슈 #94 — 템플릿 전용 확인 카피. 대상(공통/디바이스)은 컨텍스트
      // 헤더 문구 그대로 쓴다 — 공통이면 "모든 키보드" 카탈로그 문구, 디바이스면
      // 제품명(고유명사 — 번역하지 않는다, renderKeyboardsContextHeader 규약).
      $("confirm-title").textContent = t("preferences.keyboards.functionKeys.templates.confirmTitle");
      const target = $("keyboards-context-header").textContent;
      $("confirm-body").textContent = tf(
        "preferences.keyboards.functionKeys.templates.confirmBody",
        [target]
      );
      $("confirm-continue").textContent = t("preferences.keyboards.functionKeys.templates.apply");
      $("confirm-overlay").hidden = false;
      $("confirm-continue").focus();
      return;
    }
    await commitFunctionKeyTemplate(template);
  }

  // 템플릿 기록 — 각 F-키를 개별 저장 키에 기록한다(§3.3·§3.5 저장 규약 그대로,
  // 새 저장 키 없음). null 은 명시적 끔(sentinel)이다. 저장 후 renderState 가
  // 상태 전체를 다시 그린다(F-15 write-through 규약).
  // ⭐ 이슈 #94 — 공통 계층("모든 키보드") 적용 허용 + 저장 억제 두 규칙:
  // ① 이미 같은 값이면 스킵(이슈 #31 ① 저장 억제)
  // ② 공통 계층에서 `표준 F-키로 사용`(null)은 "부재"와 동작이 같다(F-15 부재 =
  //    기본값) — 명시 값(문자열)이 있는 키만 null 로 되돌리고, 부재인 키에는
  //    null 을 쌓지 않는다. 디바이스 계층은 부재와 null 이 구별되므로(§3.3) 이
  //    규칙은 공통 계층 전용이다.
  async function commitFunctionKeyTemplate(template) {
    try {
      let state = null;
      for (const fk of KEYBOARDS_FN_KEYS) {
        const key = functionKeyStorageKey(currentDevice, fk);
        const wanted = template[fk];
        const hasKey = Object.prototype.hasOwnProperty.call(currentPerDevice.values, key);
        const existing = hasKey ? currentPerDevice.values[key] : undefined;
        if (currentDevice === "all" && wanted === null && !hasKey) continue;
        if (existing === wanted) continue;
        if (wanted === null) {
          state = await invoke("settings_set", { key, value: null });
        } else {
          state = await invoke("settings_set", { key, value: wanted });
        }
      }
      if (state) renderState(state);
    } catch (err) {
      showFatal("Failed to save setting: " + String(err));
    }
  }

  // ⭐ 이슈 #46 — 복사 확인 판정(계획 §4.4). "복사가 기존 디바이스 전용 값을
  // 실제로 바꾸는가"만 확인 대화상자로 묻는다 — 같은 값으로의 교체(no-op)는
  // 파괴가 없으므로 이슈 #31 ① 의 저장 억제 철학대로 묻지 않는다. `currentPerDevice.
  // values` 원본 맵으로만 계산한다(서버 왕복 없음 — D7).
  function copyNeedsConfirm(feature) {
    if (!currentPerDevice || currentDevice === "all") return false;
    if (feature === "keyRemap") {
      const key = keyRemapRowsKey(currentDevice);
      if (!Object.prototype.hasOwnProperty.call(currentPerDevice.values, key)) return false;
      const common = currentPerDevice.values[keyRemapRowsKey("all")] || [];
      return !keyRemapRowsEqual(common, currentPerDevice.values[key] || []);
    }
    // 기능 2 — 복사 대상 키(공통 Value 키) 중 디바이스 값이 존재하고 값이 다른
    // 키가 1개 이상일 때만 확인한다.
    for (const fk of KEYBOARDS_FN_KEYS) {
      const commonVal = currentPerDevice.values[functionKeyStorageKey("all", fk)];
      if (typeof commonVal !== "string") continue;
      const deviceKey = functionKeyStorageKey(currentDevice, fk);
      if (!Object.prototype.hasOwnProperty.call(currentPerDevice.values, deviceKey)) continue;
      if (currentPerDevice.values[deviceKey] !== commonVal) return true;
    }
    return false;
  }

  // ⭐ 이슈 #46 — 복사가 **아무것도 바꾸지 않는가**(커맨드 호출 생략 판정). 이미
  // 같은 값이 저장돼 있으면 그 쓰기는 생략한다 — 단 디바이스 키가 부재(상속 중)인
  // 키는 스냅샷 물질화가 복사의 존재 이유이므로 생략하지 않는다(계획 §4.4).
  function copyIsNoOp(feature) {
    if (!currentPerDevice || currentDevice === "all") return true;
    if (feature === "keyRemap") {
      const key = keyRemapRowsKey(currentDevice);
      if (!Object.prototype.hasOwnProperty.call(currentPerDevice.values, key)) return false;
      const common = currentPerDevice.values[keyRemapRowsKey("all")] || [];
      return keyRemapRowsEqual(common, currentPerDevice.values[key] || []);
    }
    let anyTarget = false;
    for (const fk of KEYBOARDS_FN_KEYS) {
      const commonVal = currentPerDevice.values[functionKeyStorageKey("all", fk)];
      if (typeof commonVal !== "string") continue;
      anyTarget = true;
      const deviceKey = functionKeyStorageKey(currentDevice, fk);
      if (!Object.prototype.hasOwnProperty.call(currentPerDevice.values, deviceKey)) return false;
      if (currentPerDevice.values[deviceKey] !== commonVal) return false;
    }
    // 복사 대상이 하나도 없으면(이론상 — 버튼이 disabled 라 도달하지 않는다)
    // no-op 취급해 커맨드를 부르지 않는다.
    return anyTarget;
  }

  // 복사 확인 오버레이의 "계속" 버튼이 실행할 복사 작업 — 취소하면 아무것도
  // 저장하지 않은 채 덮는다(순수 프런트 상태, D7).
  let pendingCopy = null;

  function showConfirmOverlay(feature) {
    pendingCopy = { feature };
    $("confirm-title").textContent = t("preferences.keyboards.copy.confirmTitle");
    // {0} = 복사 대상 그룹 제목(이 키보드의 <그룹> 을 교체한다는 문구).
    const groupTitleKey =
      feature === "keyRemap"
        ? "preferences.keyboards.group.keyRemap.title"
        : "preferences.keyboards.group.functionKeys.title";
    $("confirm-body").textContent = tf("preferences.keyboards.copy.confirmBody", [
      t(groupTitleKey),
    ]);
    $("confirm-overlay").hidden = false;
    $("confirm-continue").focus();
  }

  function hideConfirmOverlay() {
    pendingCopy = null;
    // ⭐ 이슈 #69 K4 — 템플릿 확인 흐름도 같은 오버레이를 쓰므로 함께 초기화한다.
    pendingTemplate = null;
    pendingDeactivation = false;
    // ⭐ F-12 — 비활성화 확인에 쓴 위험 버튼 스타일·라벨을 복사 확인 기본값으로
    // 되돌린다(재사용하는 오버레이라 다음 사용을 위해 초기화한다).
    $("confirm-continue").classList.remove("danger");
    $("confirm-continue").textContent = t("preferences.keyboards.copy.confirmContinue");
    $("confirm-overlay").hidden = true;
  }

  async function invokeCopy(feature) {
    try {
      const state = await invoke("settings_copy_common_to_device", {
        device: currentDevice,
        feature,
      });
      renderState(state);
    } catch (err) {
      showFatal("Failed to copy settings: " + String(err));
    }
  }

  // 복사 흐름(계획 §4.4): no-op 이면 커맨드 호출 자체를 생략 → 필요할 때만 확인
  // 오버레이 → 확인/불필요 시 커맨드 1회 → 응답 SettingsState 로 renderState.
  async function runKeyRemapCopy() {
    if (copyIsNoOp("keyRemap")) return;
    if (copyNeedsConfirm("keyRemap")) {
      showConfirmOverlay("keyRemap");
    } else {
      await invokeCopy("keyRemap");
    }
  }

  async function runFunctionKeysCopy() {
    if (copyIsNoOp("functionKeys")) return;
    if (copyNeedsConfirm("functionKeys")) {
      showConfirmOverlay("functionKeys");
    } else {
      await invokeCopy("functionKeys");
    }
  }

  // 기능 2 — F-키 선택 팝업(§3.5, 이슈 #31 ②). 선택지 순서: `--- (공통 설정을
  // 따름)`(디바이스 선택 시에만, ② 숨김) → `표준 F-키로 사용`(⚠️ 예전에는 팝업
  // 맨 끝에 있었다 — 목적지 313개 뒤에 있으면 스크롤 없이는 사실상 못 찾는다.
  // 이 세션이 followCommon 바로 다음으로 옮겼다) → 카테고리 15개 각각
  // `<optgroup>` + 그 안의 목적지 전량.
  function populateFunctionKeySelect(id, perDevice, includeFollowCommon) {
    const select = $(id);
    select.innerHTML = "";

    if (includeFollowCommon) {
      const opt = document.createElement("option");
      opt.value = KEYBOARDS_FOLLOW_COMMON;
      opt.textContent = t("preferences.keyboards.functionKeys.followCommon");
      select.append(opt);
    }

    const standardOpt = document.createElement("option");
    standardOpt.value = KEYBOARDS_STANDARD_FKEY;
    standardOpt.textContent = t("preferences.keyboards.functionKeys.useStandardFKey");
    select.append(standardOpt);

    for (const category of perDevice.destinationCategories) {
      const inCategory = perDevice.destinations.filter((d) => d.category === category.key);
      if (inCategory.length === 0) continue;
      const group = document.createElement("optgroup");
      group.label = t(category.labelKey);
      for (const d of inCategory) {
        const opt = document.createElement("option");
        opt.value = d.value;
        // ⛔ 라벨은 번역하지 않는다 — HID usage 이름 그대로다(키캡 각인 규약,
        // destinations::FunctionDestination::label 문서 참고). 예외 하나:
        // `disable` 은 서술형 항목이라 i18n 카탈로그 문구를 쓴다.
        opt.textContent = d.value === "disable" ? t("preferences.keyboards.functionKeys.disable") : d.label;
        group.append(opt);
      }
      select.append(group);
    }
  }

  function renderFunctionKeysGroup(perDevice, device) {
    const includeFollowCommon = device !== "all";
    for (const fk of KEYBOARDS_FN_KEYS) {
      const id = `keyboards-fkey-${fk}`;
      populateFunctionKeySelect(id, perDevice, includeFollowCommon);

      const key = functionKeyStorageKey(device, fk);
      const hasKey = Object.prototype.hasOwnProperty.call(perDevice.values, key);
      let selected;
      if (!hasKey) {
        // 3상태 렌더링 — 없으면: 디바이스 선택 시 "공통 따름", For all devices
        // 선택 시 "표준 F-키로 사용"(§3.3, 이 탭 최상위에는 따를 계층이 없다).
        selected = includeFollowCommon ? KEYBOARDS_FOLLOW_COMMON : KEYBOARDS_STANDARD_FKEY;
      } else {
        const val = perDevice.values[key];
        selected = val === null ? KEYBOARDS_STANDARD_FKEY : val;
      }

      // ⭐ 저장값이 옛 SystemFunction variant 이름이거나 손상된 값이면 팝업의
      // 새 id 옵션과 매칭되지 않는다 — 그런 값을 프런트가 새 id 로 옮기지는
      // 않는다(백엔드가 읽을 때만 옮긴다, perdevice/mod.rs 근거). 화면에는
      // "표준 F-키로 사용"으로 보이되 **저장소는 건드리지 않는다** — 갈림길에서
      // 더 안전한 쪽을 골랐다: 여기서 조용히 값을 다시 써 버리면 사용자가
      // 고르지 않은 변경이 저장 파일에 남는다.
      const knownOption =
        selected === KEYBOARDS_FOLLOW_COMMON ||
        selected === KEYBOARDS_STANDARD_FKEY ||
        Array.from($(id).options).some((o) => o.value === selected);
      setSelectValue(id, knownOption ? selected : KEYBOARDS_STANDARD_FKEY);

      // ⭐ 이슈 #31 ② — 동작 미확인 힌트. 카탈로그에서 숨기는 대신 그 자리에서
      // 사실을 알린다(다른 탭의 renderHiddenNote 와 같은 "② 숨김" 패턴).
      const destination = perDevice.destinations.find((d) => d.value === selected);
      renderHiddenNote(
        `${id}-hint`,
        Boolean(destination && !destination.verified),
        "preferences.keyboards.functionKeys.unverifiedHint",
        "hint",
        "warn"
      );
    }
    // ⭐ 이슈 #46 — 기능 2 복사 버튼 활성/숨김.
    renderFunctionKeysCopyControl(perDevice, device);
    // ⭐ 이슈 #69 K2 — 기능 2 상속 복귀 버튼(② 숨김).
    renderFunctionKeysRevertControl(perDevice, device);
    // ⭐ 이슈 #69 K1-2 — 기능 2 그룹 소속 뱃지.
    renderFunctionKeysStatusBadge(perDevice, device);
    // ⭐ 이슈 #69 K4 / 이슈 #94 — 템플릿 행. 공통·디바이스 어느 선택에서도
    // 보인다 — 공통 계층에 적용하면 `perDevice.all.functionKeys.*` 로 기록되어
    // "이 앱의 기본 펑션키 세트"(사용자 요구의 "또 다른 기본 템플릿")가 된다.
    populateFunctionKeyTemplates();
    $("keyboards-functionkeys-template-row").hidden = false;
  }

  function renderKeyboardsTab(state) {
    const perDevice = state.perDevice;
    // ⚠️ 백엔드(main.rs/crates)가 아직 이 필드를 주지 않을 수 있다 — 다른
    // 세션이 동시에 작업 중이다. 그때는 이 탭을 조용히 그리지 않는다.
    if (!perDevice) return;
    currentPerDevice = perDevice;

    populateDeviceList(perDevice.devices);
    // ⭐ 이 값만은 디바이스별이 아니다 — bootstrap 이 실어 오는 macOS 전역
    // 설정의 스냅샷이라 어느 디바이스를 골라도 같다(이슈 #40 ① 이 표시줄을
    // 탭 최상단으로 올린 근거). 여기서 그리는 것은 최초 1회 페인트일 뿐이고,
    // 그 뒤로는 refreshMacosFnStateBadge() 의 폴링이 디바이스 선택과 무관하게
    // 갱신한다.
    renderMacosFnStateBadge(perDevice.fnStateIsStandard);
    // ⭐ 이슈 #69 K1 — 컨텍스트 헤더(공통/개별 식별). 두 그룹 렌더와 함께
    // 선택 대상이 바뀔 때마다 다시 그린다.
    renderKeyboardsContextHeader(perDevice, currentDevice);
    renderKeyRemapGroup(perDevice, currentDevice);
    renderFunctionKeysGroup(perDevice, currentDevice);
  }

  // ⭐ 이슈 #31 ④ — 좌측 패인 선택: 클릭 + 방향키(↑/↓) 이동. 이 파일의 탭
  // 목록(`#tablist` keydown 리스너)과 같은 수준의 키보드 처리를 맞춘다.
  $("keyboards-device-list").addEventListener("click", (ev) => {
    const opt = ev.target.closest('[role="option"]');
    if (opt) selectDevice(opt.dataset.deviceId);
  });

  $("keyboards-device-list").addEventListener("keydown", (ev) => {
    if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
    const options = Array.from($("keyboards-device-list").querySelectorAll('[role="option"]'));
    if (options.length === 0) return;
    const idx = options.findIndex((o) => o.dataset.deviceId === currentDevice);
    const nextIdx =
      ev.key === "ArrowDown" ? (idx + 1) % options.length : (idx - 1 + options.length) % options.length;
    ev.preventDefault();
    selectDevice(options[nextIdx].dataset.deviceId);
    options[nextIdx].focus();
  });

  $("keyboards-open-system-settings-btn").addEventListener("click", () => {
    invoke("open_keyboard_settings").catch((err) => {
      showFatal("Failed to open keyboard settings: " + String(err));
    });
  });

  $("keyboards-keyremap-add-btn").addEventListener("click", () => {
    if ($("keyboards-keyremap-add-btn").disabled) return;
    if (!currentPerDevice) return;
    $("keyboards-keyremap-empty").hidden = true;
    $("keyboards-keyremap-list").append(buildKeyRemapRow(currentPerDevice.sourceKeys, "", ""));
    refreshKeyRemapAddButtonState();
  });

  // ⭐ 이슈 #46 — 복사 버튼 2개(기능 1·기능 2), 상속 복귀 버튼(기능 1),
  // 복사 확인 오버레이의 취소/계속. 복귀는 기존 `commitUnset`(키 삭제 =
  // settings_unset 경로)을 그대로 재사용한다 — 백엔드 변경 없이 키만
  // `keyRemapRowsKey(currentDevice)` 로 바꾼다(계획 D4).
  // ⭐ 이슈 #69 K2 — 기능 2 복귀 버튼도 같은 `commitUnset` 경로를 쓴다. 디바이스
  // 계층의 functionKeys.f1~f12 명시적 키 전부를 삭제해 상속으로 돌아간다(§3.7.2).
  $("keyboards-keyremap-copy-btn").addEventListener("click", runKeyRemapCopy);
  $("keyboards-functionkeys-copy-btn").addEventListener("click", runFunctionKeysCopy);
  $("keyboards-keyremap-revert-btn").addEventListener("click", () => {
    commitUnset(keyRemapRowsKey(currentDevice));
  });
  $("keyboards-functionkeys-revert-btn").addEventListener("click", () => {
    for (const fk of KEYBOARDS_FN_KEYS) {
      commitUnset(functionKeyStorageKey(currentDevice, fk));
    }
  });
  // ⭐ 이슈 #69 K4 — 템플릿 적용 버튼.
  $("keyboards-functionkeys-template-apply-btn").addEventListener("click", () => {
    applyFunctionKeyTemplate($("keyboards-functionkeys-template-select").value);
  });
  $("confirm-cancel").addEventListener("click", hideConfirmOverlay);
  $("confirm-continue").addEventListener("click", async () => {
    // ⭐ F-12 — "이 기기 비활성화" 확인 흐름(§5-13): pendingDeactivation 이면
    // 키보드 복사가 아니라 비활성화를 실행한다.
    if (pendingDeactivation) {
      pendingDeactivation = false;
      hideConfirmOverlay();
      await runDeactivation();
      return;
    }
    // ⭐ 이슈 #69 K4 — 템플릿 적용 확인 흐름(복사 확인과 같은 전용 오버레이
    // 재사용 — 계획 D7 의 "순수 프런트 상태" 판본).
    const template = pendingTemplate;
    pendingTemplate = null;
    hideConfirmOverlay();
    if (template) {
      await commitFunctionKeyTemplate(FUNCTION_KEY_TEMPLATES[template.templateName]);
      return;
    }
    const copy = pendingCopy;
    hideConfirmOverlay();
    if (!copy) return; // 취소했거나 이미 다른 흐름이 오버레이를 닫은 경우
    await invokeCopy(copy.feature);
  });

  // from/to 팝업 변경 — 위임 리스너. 삭제 버튼과 달리 change 이벤트라 아래
  // 공용 document change 리스너와 겹칠 수 있으므로, data-role 이 있는 요소는
  // data-key 가 없어(공용 리스너는 data-key 만 본다) 서로 간섭하지 않는다.
  $("keyboards-keyremap-list").addEventListener("change", (ev) => {
    if (ev.target.dataset && ev.target.dataset.role) saveKeyRemapRows();
  });

  // F-키 선택 팝업 변경 — 선택지에 따라 unset/null/문자열 세 갈래로 나뉘어
  // 공용 data-key 위임 처리(el.value 를 그대로 저장)로는 표현할 수 없다.
  $("keyboards-functionkeys-list").addEventListener("change", (ev) => {
    const el = ev.target;
    const fk = el.dataset && el.dataset.fnKey;
    if (!fk) return;
    const key = functionKeyStorageKey(currentDevice, fk);
    if (el.value === KEYBOARDS_FOLLOW_COMMON) {
      commitUnset(key);
    } else if (el.value === KEYBOARDS_STANDARD_FKEY) {
      commit(key, null);
    } else {
      commit(key, el.value);
    }
  });

  // ② 숨김 — 조건이 성립할 때만 노드를 만든다. ① dimmed 와 달리 DOM 에서 사라진다.
  // ⚠️ 클래스명은 가변 인자로 받는다 — `classNames` 를 공백 포함 문자열 하나로
  // 받으면(예: `"hint warn"`) 공백이 든 큰따옴표 리터럴을 전부 문장으로 보는
  // 하드코딩 영어 문장 탐지기에 걸린다(buildKeyRemapRow 의 classList.add 와
  // 같은 회피 이유). 호출부는 토큰을 나눠 넘긴다.
  function renderHiddenNote(hostId, show, textKey, ...classNames) {
    const host = $(hostId);
    host.innerHTML = "";
    if (!show) return;
    const p = document.createElement("p");
    p.classList.add(...classNames);
    p.textContent = t(textKey);
    host.append(p);
  }

  function renderPresets(state) {
    const p = state.presets;

    // ① dimmed — 체크박스가 꺼지면 그 항목의 팝업만 흐려진다. 값은 지우지 않는다.
    const pairs = [
      ["p-caps-remap", "p-caps-remap-target", p.capsLockRemap.enabled, p.capsLockRemap.target],
      ["p-caps-quick", "p-caps-quick-action", p.capsQuickPress.enabled, p.capsQuickPress.action],
      ["p-caps-hjkl", "p-caps-hjkl-set", p.capsHjklArrows.enabled, p.capsHjklArrows.keySet],
      ["p-caps-home", "p-caps-home-scheme", p.capsHomeRow.enabled, p.capsHomeRow.scheme],
      ["p-shift-brackets", "p-shift-brackets-pair", p.shiftQuickPressBrackets.enabled, p.shiftQuickPressBrackets.pair],
      ["p-paste-plain", "p-paste-plain-trigger", p.pasteWithoutFormatting.enabled, p.pasteWithoutFormatting.trigger],
    ];
    for (const [boxId, selectId, enabled, value] of pairs) {
      $(boxId).checked = enabled;
      setSelectValue(selectId, value);
      $(selectId).disabled = !enabled;
    }

    for (const [id, value] of [
      ["p-caps-space", p.capsSpaceEnter],
      ["p-caps-wasd", p.capsWasdArrows],
      ["p-double-shift", p.doubleTapShiftToCaps],
      ["p-both-shift", p.leftRightShiftToCaps],
      ["p-shift-caps", p.shiftCapsToCaps],
      ["p-hyper-delete", p.hyperDeleteToForward],
      ["p-remap-delete", p.deleteToForward],
      ["p-shift-delete", p.shiftDeleteToForward],
      ["p-home-end", p.homeEndOnLines],
    ]) {
      $(id).checked = value;
    }

    $("p-quick-duration").value = String(p.quickPressDurationMs);
    $("p-quick-duration-value").textContent =
      tf("settings.presets.quick_press_duration.value", [p.quickPressDurationMs]);

    // ⭐ 이슈 #77 — synthesize 스위치(General 탭 Advanced 안). 저장 키가
    // `presets.*` 이므로 이 렌더의 상태 소스는 `state.presets` 다.
    $("synthesize-caps-remap").checked = p.synthesizeCapsLockRemap;

    // ② 숨김 2종.
    // ⭐ 이슈 #110 — 커널 매핑이 되읽기로 확인되지 않았으면 힌트 대신 경고를 보인다.
    if (state.capsLockKernelMapMissing) {
      renderHiddenNote("presets-caps-alias", true,
        "settings.presets.caps_alias.missing", "hint", "caps-alias-missing");
    } else {
      renderHiddenNote("presets-caps-alias", state.capsLockAliasActive,
        "settings.presets.caps_alias.note", "hint");
    }
    // §5 엣지 10 — 진짜 backspace 를 낼 수단이 사라진 상태를 사용자에게 알린다.
    renderHiddenNote("presets-delete-warning", p.deleteToForward,
      "settings.presets.delete_warning", "warn");
  }

  // ⭐ 충돌 대화상자(architecture.md §6.5) — Rust 가 `pendingConflict` 를 돌려주면
  // 설정을 아직 적용하지 않은 상태다. 사용자가 `계속` 을 고르면 상대 설정을 끄고
  // 적용하고, `취소` 하면 아무것도 바꾸지 않은 채 화면만 원래대로 되돌린다.
  let pendingConflict = null;

  function showConflict(conflict) {
    pendingConflict = conflict;
    $("conflict-title").textContent = t("settings.presets.conflict.title." + conflict.kind);
    $("conflict-body").textContent = t("settings.presets.conflict.body");
    const list = $("conflict-list");
    list.innerHTML = "";
    for (const labelKey of conflict.disableLabelKeys) {
      const li = document.createElement("li");
      li.textContent = t(labelKey);
      list.append(li);
    }
    $("conflict-overlay").hidden = false;
    $("conflict-continue").focus();
  }

  function hideConflict() {
    pendingConflict = null;
    $("conflict-overlay").hidden = true;
  }

  // ⭐ K5(이슈 #73, D-K17) — 원격 데스크톱 클라이언트 제외 목록 편집기.
  //
  // 저장 규약(명세 §3.5 정정): `korean.excludedBundleIds` = 번들 ID 문자열 배열.
  // **부재(백엔드 `excludedBundleIds: null`) = 기본 12종** — 그때는 기본 목록을
  // 편집기에 채워 보여주고, 사용자가 행 하나라도 건드리는 순간 그 화면 목록 전체가
  // 오버라이드로 굳는다(Keyboards 탭의 "물려받은 목록을 편집하면 전용 배열로
  // 굳는다"와 같은 패턴). ⛔ 병합하지 않는다 — 편집기가 보여주는 행 전체가 저장
  // 값이다. "기본 목록으로 되돌리기" 버튼은 이 오버라이드 키 자체를 지운다
  // (부재 = 기본). 저장 값은 정규화(공백 제거·빈 행 제외·중복 제거)한 뒤 보낸다 —
  // 백엔드 `resolve_excluded_bundle_ids` 와 같은 규칙(그 함수가 정본).
  function koreanExcludedRowsOf(korean) {
    return Array.isArray(korean.excludedBundleIds)
      ? korean.excludedBundleIds.slice()
      : (korean.defaultExcludedBundleIds || []).slice();
  }

  function koreanExcludedIsOverride(korean) {
    return Array.isArray(korean.excludedBundleIds);
  }

  // 화면의 완성된 행(비지 않은 입력)을 저장 배열로 수집한다. 빈 행은 저장하지
  // 않는다 — §3.4.1 항목 4(가변 목록 편집기의 빈 행 미저장 규약)를 그대로 따른다.
  // 중복 제거·공백 제거는 백엔드(`resolve_excluded_bundle_ids`)가 또 하지만, 화면과
  // 게이트를 즉시 일치시키기 위해 여기서도 같은 규칙을 적용한다.
  function collectKoreanExcludedRows() {
    const rows = [];
    const seen = new Set();
    for (const input of $("korean-excluded-list").querySelectorAll("input[type=text]")) {
      const trimmed = input.value.trim();
      if (!trimmed || seen.has(trimmed)) continue;
      seen.add(trimmed);
      rows.push(trimmed);
    }
    return rows;
  }

  function saveKoreanExcludedRows() {
    const rows = collectKoreanExcludedRows();
    if (rows.length === 0) {
      // 0행 = 명시적 빈 오버라이드("아무 앱도 제외하지 않음")다 — D-K17: 빈 배열도
      // 저장 값이다(부재와 다르다). 단, 화면에 행이 남아 있으면 그것은 "지우는
      // 중"이지 "전부 지웠다"가 아니므로 아직 저장하지 않는다(이슈 #31 ① 의 세
      // 번째 방어선과 같은 방어 — 행을 × 로 전부 지우면 이 경로로 온다).
      const domRowCount = $("korean-excluded-list").querySelectorAll(".korean-excluded-row").length;
      if (domRowCount > 0) return;
    }
    commit("korean.excludedBundleIds", rows);
  }

  // 행 하나 — [텍스트 입력] + 삭제 버튼. placeholder 는 카탈로그에서 온다.
  function buildKoreanExcludedRow(value) {
    const wrapper = document.createElement("div");
    wrapper.className = "korean-excluded-row";

    const row = document.createElement("div");
    // ⚠️ 공백이 든 className 문자열 리터럴은 하드코딩 영어 문장 탐지기에 걸린다 —
    // classList.add 로 토큰을 나눠 넣어 그 오탐을 피한다(buildKeyRemapRow 의 같은 규약).
    row.classList.add("row", "korean-excluded-row-inner");

    const input = document.createElement("input");
    input.type = "text";
    input.className = "korean-excluded-input";
    input.placeholder = t("settings.korean.excluded.rowPlaceholder");
    input.value = value;
    input.spellcheck = false;

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "keyremap-row-remove";
    removeBtn.textContent = "×";
    removeBtn.setAttribute("aria-label", t("settings.korean.excluded.removeRow"));
    removeBtn.addEventListener("click", () => {
      wrapper.remove();
      saveKoreanExcludedRows();
    });

    row.append(input, removeBtn);
    wrapper.append(row);
    return wrapper;
  }

  function renderKoreanExcludedList(korean) {
    const list = $("korean-excluded-list");
    const rows = koreanExcludedRowsOf(korean);

    // ⭐ 편집 중인 행을 재렌더로 지우지 않는다 — 이슈 #31 ② 와 같은 억제 판정.
    // 저장 응답으로 renderState 가 다시 불릴 때, 저장소의 값(정규화된 배열)과 화면의
    // 완성된 행 집합이 같으면 다시 만들지 않는다 — 방금 쓴 값이 그대로 돌아온 것이기
    // 때문이다. 다르면(외부 변경·import·되돌리기) 목록을 새로 만든다.
    const rendered = Array.from(list.querySelectorAll(".korean-excluded-input")).map((el) => el.value.trim()).filter((v) => v.length > 0);
    const same = rendered.length === rows.length && rendered.every((v, i) => v === rows[i]);
    if (!same) {
      list.innerHTML = "";
      for (const row of rows) {
        list.append(buildKoreanExcludedRow(row));
      }
    }
    // 빈 목록 안내는 화면에 실제로 있는 행 기준(위와 같은 이유).
    const domRowCount = list.querySelectorAll(".korean-excluded-row").length;
    $("korean-excluded-empty").hidden = domRowCount > 0;
    // 되돌리기 버튼은 오버라이드가 존재할 때만 뜬다 — 부재는 이미 기본 목록이므로
    // 되돌릴 대상이 없다(② 숨김, F-17 복귀 버튼과 같은 규약).
    $("korean-excluded-reset-btn").hidden = !koreanExcludedIsOverride(korean);
  }

  // 행 추가·삭제·내용 변경 각각이 저장 1회다(F-15 §3.1.1 — 컨트롤 단위 즉시
  // write-through, F-17 §3.4.1 의 행 단위 해석과 같다).
  function addKoreanExcludedRow() {
    $("korean-excluded-list").append(buildKoreanExcludedRow(""));
    const inputs = $("korean-excluded-list").querySelectorAll(".korean-excluded-input");
    if (inputs.length > 0) inputs[inputs.length - 1].focus();
  }

  // ② 숨김 — trackpad.enabled 가 꺼지면 두 체크박스 행을 DOM 에서 완전히
  // 제거한다(display:none 이 아니다). ① dimmed(트랙패드 팝업 자체는 이 함수가
  // 다루지 않는다 — 트랙패드 영역 팝업은 dimmed 대상이 아니라 항상 조작 가능하다)
  // 와 혼동하지 않도록 구현을 분리해 둔다.
  function renderTrackpadExtra(trackpad) {
    const host = $("trackpad-extra");
    host.innerHTML = "";
    if (!trackpad.enabled) return;

    const changeIcon = document.createElement("label");
    changeIcon.className = "checkbox-row";
    const changeIconInput = document.createElement("input");
    changeIconInput.type = "checkbox";
    changeIconInput.dataset.key = "hyperkey.trackpad.changeMenuBarIcon";
    changeIconInput.checked = trackpad.changeMenuBarIcon;
    const changeIconLabel = document.createElement("span");
    changeIconLabel.textContent = t("settings.hyperkey.trackpad.change_icon");
    changeIcon.append(changeIconInput, changeIconLabel);

    const haptic = document.createElement("label");
    haptic.className = "checkbox-row";
    const hapticInput = document.createElement("input");
    hapticInput.type = "checkbox";
    hapticInput.dataset.key = "hyperkey.trackpad.haptic";
    hapticInput.checked = trackpad.haptic;
    const hapticLabel = document.createElement("span");
    hapticLabel.textContent = t("settings.hyperkey.trackpad.haptic");
    haptic.append(hapticInput, hapticLabel);

    host.append(changeIcon, haptic);
  }

  function renderWarnings(warnings) {
    const host = $("hyperkey-warnings");
    host.innerHTML = "";
    host.hidden = warnings.length === 0;
    for (const w of warnings) {
      const p = document.createElement("p");
      p.className = "warn";
      const key = w.kind === "duplicate"
        ? "settings.hyperkey.warning.duplicate"
        : "settings.hyperkey.warning.unknown_key";
      p.textContent = tf(key, [w.key]);
      host.append(p);
    }
  }

  // ─────────────────────────────────────────────────────────────────────────
  // Seek 탭(F-01, seek-activation-and-session.md §4) — 활성화 트리거 3종의
  // 배선. `state.seek` 가 아직 없을 수 있다(다른 세션이 아직 Rust 쪽을 안
  // 끝냈을 때) — renderKeyboardsTab 의 state.perDevice 방어와 같은 패턴으로
  // renderSeek() 이 조용히 아무 일도 하지 않는다.
  let currentSeekState = null; // 마지막으로 받은 state.seek(Escape 취소 시 복원용)
  // ⭐(이슈 #93) — 검색 언어 팝업이 "부재(= 로케일 폴백) 상태였는가". 부재 상태에서
  // 사용자가 팝업을 조작하면 유효 값이 명시 값으로 굳는다(Plan §9 #2).
  let seekSearchLanguageWasAbsent = true;
  let seekRecording = false;
  let seekRecordingHandler = null;

  // ⭐ modifier 비트마스크 — `EventFlags` 관례(crates/ultrakey-core/src/flags.rs)를
  // 그대로 옮긴다. 여기서 새 값을 정의하지 않고 그 파일의 상수와 일치시켜야
  // 하며, `seek_modifier_비트값이_ultrakey_core_flags와_일치한다` 테스트가
  // flags.rs 를 직접 읽어 이 값을 대조한다 — 테스트 안에 기대값을 다시 적지
  // 않는 것이 이 저장소의 M2-2 사고 재발 방지 원칙이다.
  const SEEK_SHORTCUT_MOD_SHIFT = 0x20000; // EventFlags::SHIFT
  const SEEK_SHORTCUT_MOD_CONTROL = 0x40000; // EventFlags::CONTROL
  const SEEK_SHORTCUT_MOD_OPTION = 0x80000; // EventFlags::ALTERNATE (option/alt)
  const SEEK_SHORTCUT_MOD_COMMAND = 0x100000; // EventFlags::COMMAND (command/meta)

  // modifier 만 눌린 상태(예: `ShiftLeft`)는 조합의 일부일 뿐 그 자체가
  // 단축키가 아니다 — 이런 keydown 은 무시하고 계속 기다린다.
  function isSeekModifierOnlyCode(code) {
    return (
      code.startsWith("Shift") ||
      code.startsWith("Control") ||
      code.startsWith("Alt") ||
      code.startsWith("Meta")
    );
  }

  // 레코더 버튼·지우기 버튼의 표시만 갱신한다(체크박스·팝업은 renderSeek()
  // 소관). 녹음 중에는 renderSeek() 이 이 호출을 건너뛴다 — 그래야 modifiers
  // 저장과 code 저장 사이에 오는 재렌더가 "녹음 중" 라벨을 지우지 않는다.
  function renderSeekShortcutButtons(seek) {
    const recordBtn = $("seek-shortcut-record");
    recordBtn.textContent = seek.toggleShortcut
      ? seek.toggleShortcut.display
      : t("settings.seek.record_shortcut");
    recordBtn.setAttribute("aria-pressed", "false");
    $("seek-shortcut-clear").hidden = !seek.toggleShortcut;
  }

  function stopSeekRecording() {
    if (seekRecordingHandler) {
      window.removeEventListener("keydown", seekRecordingHandler, true);
      seekRecordingHandler = null;
    }
    seekRecording = false;
  }

  // ⭐ 캡처 단계에서 잡고 stopPropagation 한다 — 녹음 중에는 `#tablist` 의
  // 탭 전환 keydown 핸들러가 같은 키 입력을 먹지 않게 한다.
  function startSeekRecording() {
    if (seekRecording) return;
    seekRecording = true;
    const btn = $("seek-shortcut-record");
    btn.textContent = t("settings.seek.recording");
    btn.setAttribute("aria-pressed", "true");

    seekRecordingHandler = (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      if (isSeekModifierOnlyCode(ev.code)) return;
      if (ev.code === "Escape") {
        // 녹음 취소 — 저장하지 않고 원래 상태로 되돌린다.
        stopSeekRecording();
        if (currentSeekState) renderSeekShortcutButtons(currentSeekState);
        return;
      }
      let modifiers = 0;
      if (ev.shiftKey) modifiers |= SEEK_SHORTCUT_MOD_SHIFT;
      if (ev.ctrlKey) modifiers |= SEEK_SHORTCUT_MOD_CONTROL;
      if (ev.altKey) modifiers |= SEEK_SHORTCUT_MOD_OPTION;
      if (ev.metaKey) modifiers |= SEEK_SHORTCUT_MOD_COMMAND;
      const code = ev.code;
      stopSeekRecording();
      // ⭐ modifiers 먼저, code 나중 — code 가 나중이어야 Rust 쪽이 완성된
      // 조합으로 등록한다(§4).
      (async () => {
        await commit("seek.toggleShortcut.modifiers", modifiers);
        await commit("seek.toggleShortcut.code", code);
      })();
    };
    window.addEventListener("keydown", seekRecordingHandler, true);
  }

  $("seek-shortcut-record").addEventListener("click", () => {
    startSeekRecording();
  });

  $("seek-shortcut-clear").addEventListener("click", async () => {
    await commit("seek.toggleShortcut.code", "");
    await commit("seek.toggleShortcut.modifiers", 0);
  });

  // ⭐(이슈 #93) — 부재(로케일 폴백) 상태에서 사용자가 검색 언어 팝업을 열고
  // 고르면(같은 행을 다시 골라도) 유효 값이 명시 값으로 굳는다 — 그래야 한국어
  // UI 사용자가 그대로 두면 로케일 폴백(영문 입력 전용)에 갇히지 않는다. 값
  // 변화가 없어 `change` 가 안 오는 경우를 잡는 커버다 `change` 더블 커밋은
  // 무해하다(같은 값 영속화).
  $("seek-search-language").addEventListener("click", () => {
    if (!seekSearchLanguageWasAbsent) return;
    commit("seek.searchLanguage", $("seek-search-language").value);
  });

  // ⭐(이슈 #93) — 검색 언어 팝업 선택지 5 종(영어 단일 + 비영어 4 종).
  // 라벨은 카탈로그(`settings.seek.search_language.option.*`)에서 번역한다.
  const SEARCH_LANGUAGE_OPTIONS = [
    { code: "en", labelKey: "settings.seek.search_language.option.en" },
    { code: "ko", labelKey: "settings.seek.search_language.option.ko" },
    { code: "zh", labelKey: "settings.seek.search_language.option.zh" },
    { code: "ja", labelKey: "settings.seek.search_language.option.ja" },
    { code: "es", labelKey: "settings.seek.search_language.option.es" },
  ];

  function populateSearchLanguageSelect() {
    const select = $("seek-search-language");
    select.innerHTML = "";
    for (const o of SEARCH_LANGUAGE_OPTIONS) {
      const opt = document.createElement("option");
      opt.value = o.code;
      opt.textContent = t(o.labelKey);
      select.append(opt);
    }
  }

  // 유효 검색 언어 — 명시 값이 있으면 그것, 없으면(부재 = 로케일 폴백) UI
  // 언어(`general.language`, 이미 해석된 code)에서 파생한다(Plan D1·D6).
  function effectiveSearchLanguage(state) {
    const seek = state.seek;
    if (seek && seek.searchLanguage) return seek.searchLanguage;
    const ui = state.general && state.general.language;
    return (ui === "ko" || ui === "zh" || ui === "ja" || ui === "es") ? ui : "en";
  }

  function renderSeek(state) {
    const seek = state.seek;
    if (!seek) return; // 방어 — renderKeyboardsTab 의 state.perDevice 방어와 같은 패턴.
    currentSeekState = seek;

    fillSelect("seek-remap-key", seek.remapKeyOptions);
    setSelectValue("seek-remap-key", seek.remapKey);

    // ⭐(이슈 #93) — 검색 언어. 부재면 유효 값(로케일 파생)이 선택된 것으로
    // 보인다. 명시 값이 있으면 그 값이 선택된다.
    populateSearchLanguageSelect();
    setSelectValue("seek-search-language", effectiveSearchLanguage(state));
    seekSearchLanguageWasAbsent = !seek.searchLanguage;

    // ⭐ §4 실측 — 팝업이 체크박스를 좌우한다(Hyperkey 탭의 체크박스→팝업
    // dimmed 방향과 반대). 값은 지우지 않고 보존한다.
    $("seek-execute-on-close").checked = seek.executeOnClose;
    $("seek-execute-on-close").disabled = seek.remapKey === "-";

    $("seek-semicolon-cycle").checked = seek.semicolonCycles;

    // ⭐ F-04(이슈 #44) — 체크박스 2종. 출고 기본값(명세 §4): focusWindow ☐,
    // changeClickModes ☑ — 저장 키 부재 시 SeekSettings 가 이미 기본값을
    // 반영해 온다(부재 = 기본값).
    $("seek-focus-window-before-clicking").checked = seek.focusWindowBeforeClicking;
    $("seek-change-click-modes-with-modifiers").checked = seek.changeClickModesWithModifiers;

    if (!seekRecording) {
      renderSeekShortcutButtons(seek);
    }

    // ⭐ 온보딩 함의(§1) — 세 활성화 경로가 전부 미설정이면 발동 방법이
    // 전혀 없다는 것을 알린다.
    $("seek-not-configured").hidden = seek.anyActivationConfigured;
  }

  function renderState(state) {
    renderSeek(state);

    $("hyper-enabled").checked = state.hyperkey.hyper.enabled;
    setSelectValue("hyper-source", state.hyperkey.hyper.source);
    // ① dimmed — 체크박스가 꺼지면 팝업만 흐려지고 조작 불가. 값은 지우지 않는다.
    $("hyper-source").disabled = !state.hyperkey.hyper.enabled;

    $("include-shift").checked = state.hyperkey.includeShiftInHyper;
    $("hyper-preview").textContent = state.hyperPreview;

    $("meh-enabled").checked = state.hyperkey.meh.enabled;
    setSelectValue("meh-source", state.hyperkey.meh.source);
    $("meh-source").disabled = !state.hyperkey.meh.enabled;

    $("bleh-enabled").checked = state.hyperkey.bleh.enabled;
    setSelectValue("bleh-source", state.hyperkey.bleh.source);
    $("bleh-source").disabled = !state.hyperkey.bleh.enabled;

    $("mouse-click").checked = state.hyperkey.mouseApply.click;
    $("mouse-drag").checked = state.hyperkey.mouseApply.drag;
    $("mouse-move").checked = state.hyperkey.mouseApply.move;
    $("mouse-scroll").checked = state.hyperkey.mouseApply.scroll;

    $("trackpad-enabled").checked = state.hyperkey.trackpad.enabled;
    setSelectValue("trackpad-area", state.hyperkey.trackpad.area);
    renderTrackpadExtra(state.hyperkey.trackpad);

    renderPresets(state);

    // Keyboards 탭(F-17) — 백엔드가 아직 state.perDevice 를 주지 않을 수 있어
    // renderKeyboardsTab() 내부가 방어한다(위 정의 주석 참고).
    renderKeyboardsTab(state);

    // F-16 — 5개 체크박스(2단계로 전부 활성, D-K14) + ⭐ K9 옵션(이슈 #73).
    $("korean-shift-space").checked = state.korean.shiftSpaceSwitchesInputSource;
    $("korean-han-eng").checked = state.korean.hanEngSwitchesInputSource;
    $("korean-hanja").checked = state.korean.hanjaKeyConvertsHanja;
    $("korean-won-backtick").checked = state.korean.wonKeyTypesBacktick;
    $("korean-remote-desktop").checked = state.korean.disableInRemoteDesktop;
    $("korean-modifier-lowercase").checked = state.korean.modifierKeyTypesLowercase;
    // ⭐ K5(이슈 #73) — 제외 대상 목록 편집기.
    renderKoreanExcludedList(state.korean);

    // F-10 — 실제로 동작하는 항목들(자동 업데이트는 F-13 으로 활성, F-12 라이선스 컨트롤만 비활성).
    $("launch-on-login").checked = state.general.launchOnLogin;
    $("auto-update").checked = state.general.autoUpdate;
    $("hide-menu-bar-icon").checked = state.general.hideMenuBarIcon;
    // ⭐ B-4(이슈 #39, §3.5-a) — `requires-approval` 일 때만 안내 행을 보인다.
    renderHiddenNote(
      "launch-on-login-requires-approval",
      state.general.launchOnLoginStatus === "requires-approval",
      "settings.general.launch_on_login.requires_approval",
      "hint", "why",
    );
    // ⭐ D6(이슈 #39, §3.1.2-a) — `null` = "시스템 설정 따름"(키 부재).
    setSelectValue("general-language", state.general.language || "system");
    renderWarnings(state.warnings);

    if (state.pendingConflict) {
      showConflict(state.pendingConflict);
    }

    if (state.saveError) {
      showNotice(tf("settings.save_failed", [state.saveError]));
    }
  }

  function renderGeneral(meta) {
    $("version-btn").textContent = tf("settings.general.version", [meta.version]);
    // ⭐ 이슈 #87 — About 창 신설로 로그 위치 행은 설정 창에서 빠졌다(About 창으로
    // 이동). 남은 번들 ID·설정 파일 경로 행은 Advanced 섹션에 있다.
    $("about-bundle-id").textContent = meta.bundleId;
    $("about-settings-path").textContent = meta.settingsFileExists && meta.settingsPath
      ? meta.settingsPath
      : t("settings.general.about.settings_absent");
  }

  // ⭐ F-12(이슈 #59) — General 탭 라이선스 상태 표시. 백엔드 `license_state` 가
  // 준 `LicenseView` 로 상태 문자열·남은 일수·슬롯 현황을 그린다. `is_licensed`
  // = true 일 때만 "이 기기 비활성화" 버튼을 활성화한다(§4.2 "비활성 상태에서는
  // 회색 처리").
  function renderLicense(license) {
    const statusEl = $("license-status");
    const badgeEl = $("license-state-badge");
    badgeEl.textContent = "";

    let label;
    if (license.state === "licensed") {
      label = t("settings.general.license.status.licensed");
      if (license.activationsUsed != null) {
        label = tf("settings.general.license.status.licensed.slots", [
          String(license.activationsUsed),
          String(license.activationsLimit),
        ]);
        badgeEl.textContent = t("settings.general.license.status.licensed.badge");
      }
    } else if (license.state === "trial" && license.daysRemaining != null) {
      label = tf("settings.general.license.status.trial", [String(license.daysRemaining)]);
    } else if (license.state === "trial_expired") {
      label = t("settings.general.license.status.expired");
    } else {
      label = t("settings.general.license.status.invalid");
    }
    statusEl.textContent = label;

    // "이 기기 비활성화" — 라이선스 활성일 때만 활성화(§4.2 회색 처리).
    $("remove-activation-btn").disabled = !license.isLicensed;
  }

  async function refreshLicense() {
    try {
      const license = await invoke("license_state");
      renderLicense(license);
    } catch (err) {
      // 라이선스 상태 조회 실패는 심각하지 않다 — 상태 배지만 "문제 있음"으로 두고
      // 계속 쓴다. 사유는 로그에 맡긴다(Rust 쪽).
    }
  }

  function showNotice(text) {
    const el = $("notice");
    el.textContent = text;
    el.hidden = false;
  }

  // ⭐ 이슈 #39 Phase 2 — export/import 결과를 General 탭의 안내 줄에 보여준다
  // (위임 지시서 A-3, `#notice` 와 별도 — 그쪽은 전역 안내라 탭을 넘나든다).
  function setTransferResult(text) {
    const el = $("general-transfer-result");
    el.textContent = text;
    el.hidden = !text;
  }

  // ⭐ UXR-07 (이슈 #79) — 탭 패널 페이드 인. [hidden](display:none) 에서는
  // transition 이 켜지지 않으므로, hidden 해제 직후 인라인 opacity 0 을 세팅하고
  // 브라우저가 그 시작값을 페인트에 반영하도록 reflow 를 강제한 뒤, rAF 한 프레임
  // 후 인라인을 지워 CSS 기본(opacity 1)로 전환한다. 감소 모션 시 즉시 표시 —
  // 애초에 인라인 0 을 세팅하지 않는다(절대 투명 상태로 시작하지 않는다). JS 가
  // 죽은 정적 렌더에서도 패널은 CSS 기본 opacity 1 로 즉시 보인다(④).
  function revealTabPanel(panel) {
    const reduceMotion =
      window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion) return;
    panel.style.opacity = "0";
    if (panel.getBoundingClientRect) panel.getBoundingClientRect(); // reflow 강제
    requestAnimationFrame(() => {
      panel.style.opacity = "";
    });
  }

  function activateTab(tab, { persist = true } = {}) {
    activeTab = tab;
    for (const name of TABS) {
      const active = name === tab;
      const btn = $(`tab-${name}`);
      btn.setAttribute("aria-selected", String(active));
      btn.tabIndex = active ? 0 : -1;
      const panel = $(`panel-${name}`);
      panel.hidden = !active;
      if (!active) panel.style.opacity = ""; // 다음 표시 때 깨끗하게(UXR-07)
    }
    if (!$(`panel-${tab}`).hidden) revealTabPanel($(`panel-${tab}`));
    // ⭐ 이슈 #32 Phase 1 부터 탭 전환은 창 크기를 바꾸지 않는다 — 이 invoke 는
    // 이제 (1) Rust 쪽 탭 화이트리스트(KNOWN_TABS) 검증과 (2) persist 가 true 일
    // 때 ui.lastTab 저장, 이 두 가지만 한다.
    //
    // ⭐ `persist` 는 **ui.lastTab 저장 여부**를 가른다. 최초 렌더에서도 이
    // 커맨드를 불러야 하지만, 그때 저장까지 하면 **환경설정 창을 열기만 해도
    // settings.json 이 생겨** F-15 §8 의 "한 번도 건드리지 않으면 파일이 없다"가
    // 첫 실행에서 바로 깨진다.
    invoke("settings_set_tab", { tab, persist }).catch((err) => {
      showFatal("Failed to switch tab: " + String(err));
    });
    // Keyboards 탭이 보이는 동안에만 macOS Function Keys 토글을 폴링한다.
    syncFnStatePolling();
  }

  $("tablist").addEventListener("keydown", (ev) => {
    const idx = TABS.indexOf(activeTab);
    let next = null;
    if (ev.key === "ArrowDown" || ev.key === "ArrowRight") {
      next = TABS[(idx + 1) % TABS.length];
    } else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") {
      next = TABS[(idx - 1 + TABS.length) % TABS.length];
    }
    if (next) {
      ev.preventDefault();
      activateTab(next);
      $(`tab-${next}`).focus();
    }
  });

  for (const name of TABS) {
    $(`tab-${name}`).addEventListener("click", () => activateTab(name));
  }

  async function commit(key, value) {
    try {
      const state = await invoke("settings_set", { key, value });
      renderState(state);
    } catch (err) {
      showFatal("Failed to save setting: " + String(err));
    }
  }

  // 체크박스·팝업 전부를 data-key 속성 하나로 위임 처리한다 — 컨트롤마다
  // 리스너를 따로 붙이면 41개(§7)에 달하는 컨트롤 각각에 중복 코드가 생긴다.
  document.addEventListener("change", (ev) => {
    const el = ev.target;
    const key = el.dataset && el.dataset.key;
    if (!key) return;
    let value;
    if (el.type === "checkbox") {
      value = el.checked;
    } else if (el.dataset.kind === "number") {
      // 슬라이더는 문자열을 주므로 숫자로 바꿔 보낸다 — Rust 쪽이 u64 로 받는다.
      value = Number(el.value);
    } else {
      value = el.value;
    }
    commit(key, value);
  });

  // 드래그 중에는 저장하지 않고 값 라벨만 실시간으로 갱신한다(§3.7). 저장은
  // 손을 뗄 때 발생하는 `change` 한 번뿐이다 — 컨트롤 단위 즉시 write-through
  // 규약(F-15 §3.1.1)을 지키면서도 드래그마다 파일을 쓰지는 않는다.
  $("p-quick-duration").addEventListener("input", (ev) => {
    $("p-quick-duration-value").textContent =
      tf("settings.presets.quick_press_duration.value", [Number(ev.target.value)]);
  });

  // ⭐ K5(이슈 #73) — 제외 목록 편집기의 배선. 행 추가 버튼·되돌리기 버튼·행 입력의
  // change(포커스를 잃을 때 저장 1회 — F-17 §3.4.1 "행의 from/to 변경이 저장 1회"와
  // 같은 규약). 빈 행은 저장되지 않으므로 입력 도중에 쓰지 않는다.
  $("korean-excluded-add-btn").addEventListener("click", addKoreanExcludedRow);
  $("korean-excluded-list").addEventListener("change", (ev) => {
    if (ev.target && ev.target.classList.contains("korean-excluded-input")) {
      saveKoreanExcludedRows();
    }
  });
  // 되돌리기 = 오버라이드 키 삭제(부재 = 기본 12종, D-K17). `settings_set` 에
  // null 을 보낸다 — `commit` 경로에서 null 은 그대로 저장되고 `KoreanView` 는
  // `excludedBundleIds: null` 로 되돌려 주므로, 화면이 기본 목록으로 다시 그려진다.
  $("korean-excluded-reset-btn").addEventListener("click", () => {
    commit("korean.excludedBundleIds", null);
  });

  $("conflict-cancel").addEventListener("click", async () => {
    hideConflict();
    // 아무것도 적용하지 않았으므로 서버 상태를 다시 그려 체크박스를 되돌린다.
    try {
      const bootstrap = await invoke("settings_bootstrap");
      renderState(bootstrap.state);
    } catch (err) {
      showFatal("Failed to render: " + String(err));
    }
  });

  $("conflict-continue").addEventListener("click", async () => {
    const conflict = pendingConflict;
    hideConflict();
    if (!conflict) return;
    try {
      const state = await invoke("settings_resolve_conflict", {
        key: conflict.key,
        value: conflict.value,
      });
      renderState(state);
    } catch (err) {
      showFatal("Failed to save setting: " + String(err));
    }
  });

  // ⭐ ⭐ §9 #2(이슈 #87) — 버전 버튼이 About 정보를 펼치던 것을 버리고 **About
  // 창을 연다**(원본 실측 버튼의 클릭 동작 추정 방향 — preferences-ui.md §9 Q12).
  $("version-btn").addEventListener("click", () => {
    invoke("open_about_window").catch((err) => {
      showFatal("Failed to open the About window: " + String(err));
    });
  });

  // ⭐ 이슈 #39 Phase 2(A-1·A-2) — 대화상자는 Rust 쪽(`settings_export` 커맨드)
  // 에서만 연다. 사용자가 취소하면 `null` 이 온다 — 오류가 아니므로 조용히 넘어간다.
  $("settings-export-btn").addEventListener("click", async () => {
    try {
      const result = await invoke("settings_export");
      if (result) setTransferResult(tf("settings.general.export.done", [result.path]));
    } catch (err) {
      // ⭐ 대화상자/디스크 I/O 실패는 드문 진단 상황이라 다른 커맨드들과 같은
      // 관례(카탈로그를 거치지 않는 진단 전용 문구)를 따른다 — export 에는
      // 전용 카탈로그 키가 없다(위임 지시서 A-4 목록 참고).
      showFatal("Failed to export settings: " + String(err));
    }
  });

  // ⭐ A-2 결정 6·7 — import 는 실패해도(잘못된 파일 등) 페이지를 깨뜨리지
  // 않는다. 흔한 사용자 실수(엉뚱한 파일 선택)라 `settings.general.import.failed`
  // 로 안내 줄에만 보여준다. 성공하면 `settings_bootstrap` 을 다시 불러 전체를
  // 재렌더한다(A-2 결정 6의 마지막 단계, `general-language` 재렌더와 같은 패턴).
  $("settings-import-btn").addEventListener("click", async () => {
    try {
      const result = await invoke("settings_import");
      if (!result) return; // 취소 — 오류가 아니다.
      const parts = [tf("settings.general.import.done", [result.appliedKeys, result.backupPath || "—"])];
      if (result.absentDevices.length > 0) {
        parts.push(tf("settings.general.import.absent_devices", [result.absentDevices.length]));
      }
      setTransferResult(parts.join(' '));
      await loadAndRenderBootstrap(activeTab);
    } catch (err) {
      setTransferResult(tf("settings.general.import.failed", [String(err)]));
    }
  });

  // ⭐ F-18(§3.1) — 창 자체의 수명주기(계측 on/off, 버퍼 비움)는 전부 Rust 쪽
  // (`open_event_viewer` 커맨드, 창 close 이벤트)이 맡는다. 이 버튼은 그 커맨드를
  // 부를 뿐이다.
  $("open-event-viewer-btn").addEventListener("click", () => {
    invoke("open_event_viewer").catch((err) => {
      showFatal("Failed to open the Event Viewer: " + String(err));
    });
  });

  // ⭐ 이슈 #47 — 로그 폴더 열기. `open_log_folder` 커맨드는 디렉터리 부재를
  // 조용히 Ok(()) 로 처리하므로(위임 지시서 "경로 없으면 조용히 무시" 제약) 이
  // 진단 문구는 `open` spawn 실패(진짜 예외)에만 도달한다.
  $("open-log-folder-btn").addEventListener("click", () => {
    invoke("open_log_folder").catch((err) => {
      showFatal("Failed to open the log folder: " + String(err));
    });
  });

  // ⭐ F-12(이슈 #59) — 활성화·비활성화 버튼.
  $("license-activate-btn").addEventListener("click", async () => {
    const key = $("license-key-input").value.trim();
    if (!key) {
      $("license-status").textContent = t("settings.general.license.key.required");
      return;
    }
    try {
      const license = await invoke("license_activate", { licenseKey: key });
      renderLicense(license);
    } catch (err) {
      // §5 실패 모드: 한도 초과·키 오류 등은 사유별 문구로 안내한다.
      const reason = String(err);
      const map = {
        "limit_reached": "settings.general.license.fail.limit",
        "invalid_key": "settings.general.license.fail.invalid",
        "refunded": "settings.general.license.fail.refunded",
        "network_error": "settings.general.license.fail.network",
      };
      $("license-status").textContent = map[reason]
        ? t(map[reason]) : tf("settings.general.license.fail.generic", [reason]);
    }
  });

  // §5-13 · §3.3.2 실측 노트 — "이 기기 비활성화" 는 되돌릴 수 없는 조작이므로
  // 실행 전 확인 대화상자를 반드시 거친다. `confirm-overlay` 를 재사용해
  // "확인해야만 요청이 전송"된다.
  let pendingDeactivation = false;
  $("remove-activation-btn").addEventListener("click", () => {
    pendingDeactivation = true;
    const title = t("settings.general.license.deactivate.title");
    const body = t("settings.general.license.deactivate.body");
    $("confirm-title").textContent = title;
    $("confirm-body").textContent = body;
    $("confirm-continue").textContent = t("settings.general.license.deactivate.continue");
    $("confirm-continue").classList.add("danger");
    $("confirm-overlay").hidden = false;
    $("confirm-continue").focus();
  });

  async function runDeactivation() {
    try {
      const license = await invoke("license_deactivate");
      renderLicense(license);
    } catch (err) {
      // §5-8 서버 다운 — 낙관적으로 풀지 않았다. 사유를 상태 줄에 보여준다.
      const reason = String(err);
      const map = {
        "network_error": "settings.general.license.fail.deactivate.network",
        "not_found": "settings.general.license.fail.deactivate.not_found",
      };
      $("license-status").textContent = map[reason]
        ? t(map[reason]) : tf("settings.general.license.fail.generic", [reason]);
    }
  }

  // ⭐ A-3(D6, 이슈 #39, §3.1.2-a) — `settings_bootstrap` 을 (다시) 불러 화면
  // 전체를 그리는 단일 경로. `boot()` 의 최초 렌더와, 언어를 바꾼 뒤의 재렌더가
  // 이 함수 하나를 공유한다 — 문자열을 부분 갱신하는 별도 코드를 만들면 라벨을
  // 빠뜨리기 쉽다는 것이 이 통합의 근거다. `preferredTab` 을 생략하면 서버가
  // 기억하는 `lastTab` 을 쓴다(최초 부팅 때의 동작).
  async function loadAndRenderBootstrap(preferredTab) {
    const bootstrap = await invoke("settings_bootstrap");
    STRINGS = bootstrap.strings;
    applyStrings();
    // ⭐ 이슈 #45 — 상세 헤딩의 탭 아이콘. 문자열 재적용(언어 변경) 경로에서도
    // 함께 불러 헤딩 구조가 통째로 다시 그려진 뒤 아이콘이 사라지지 않게 한다
    // (함수 안의 가드가 중복 부착을 막는다).
    mountTabHeadingIcons();
    populateSourceSelects(bootstrap.state.sourceKeys);
    populateTrackpadAreaSelect(bootstrap.state.trackpadAreas);
    populatePresetSelects(bootstrap.state.presetOptions);
    populateLanguageSelect(bootstrap.languages);
    renderState(bootstrap.state);
    renderGeneral(bootstrap.meta);
    // ⭐ F-12 — 라이선스 상태는 별도 커맨드로 조회해 그린다(설정 부트스트랩 상태
    // 에 포함하지 않는 이유: 라이선스는 설정이 아니라 Keychain 기반 실행 상태다).
    refreshLicense();
    if (bootstrap.notice) {
      showNotice(tf(bootstrap.notice.messageKey, [bootstrap.notice.arg]));
    }
    // 탭 화이트리스트 검증만 하고 저장하지 않는다(위 activateTab 주석 참고) —
    // 언어를 바꾸는 것만으로 ui.lastTab 이 갱신되면 안 된다.
    activateTab(preferredTab !== undefined ? preferredTab : (bootstrap.state.lastTab || "hyperkey"), { persist: false });
    return bootstrap;
  }

  async function boot() {
    try {
      await loadAndRenderBootstrap();
    } catch (err) {
      showFatal("Failed to render: " + String(err));
    }
  }

  // ⭐ D6 — `general.language` 는 범용 `commit()` 위임 경로를 쓰지 않는다(그래서
  // 이 `<select>` 에는 `data-key` 를 붙이지 않았다): "System" 은 값이 아니라
  // 키 **삭제**(`null`)로 보내야 하고, 응답으로 문자열 카탈로그 전체가 바뀌므로
  // `settings_set` 의 반환값이 아니라 `settings_bootstrap` 을 다시 불러야 한다
  // (§3.1.2-a "적용 시점" — 재시작을 요구하지 않는다).
  $("general-language").addEventListener("change", async (ev) => {
    const raw = ev.target.value;
    const value = raw === "system" ? null : raw;
    try {
      await invoke("settings_set", { key: "general.language", value });
      await loadAndRenderBootstrap(activeTab);
    } catch (err) {
      showFatal("Failed to change language: " + String(err));
    }
  });

  boot();
}
</script>
</body>
</html>
