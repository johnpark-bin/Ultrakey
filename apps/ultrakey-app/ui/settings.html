<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- ⭐ "Ultrakey" 는 브랜드 고유명사라 번역 대상이 아니다 — index.html 과 같은 근거
     (ultrakey-i18n 의 app_name_is_not_translated 테스트가 이 판단을 이미 뒷받침한다).
     실제 창 제목은 tauri.conf.json 의 windows[].title 이 결정하며 이 <title> 은
     그것과 일치시켜 둘 뿐이다. -->
<title>Ultrakey</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    /* index.html 과 같은 이유로 불투명 시스템 색을 쓴다 — transparent 는
       tauri.conf.json 에 transparent:true 가 없는 한 효과가 없고, 렌더 실패 시
       창이 "텅 비어 보이는" 실패 모드를 더 나쁘게 만들 뿐이다. */
    background: Canvas;
    color: CanvasText;
  }

  #fatal { padding: 28px 32px; }
  #fatal h1 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }

  .shell { display: flex; height: 100vh; }

  .sidebar {
    display: flex;
    flex-direction: column;
    width: 148px;
    flex: 0 0 auto;
    padding: 14px 8px;
    gap: 2px;
    background: color-mix(in srgb, currentColor 4%, transparent);
    border-right: 1px solid color-mix(in srgb, currentColor 12%, transparent);
  }
  .sidebar button {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    padding: 7px 10px;
    border-radius: 6px;
    font: inherit;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* ⭐ UXR-01 — 선택 상태는 시스템 강조색 채움으로. currentColor 농도만으로는
     hover(8%)와 선택(14%)의 차이가 약하고 라이트/다크에서 같은 회색 톤이라
     "지금 어느 탭을 보고 있는가"가 덜 또렷하다. Highlight 는 시스템 강조색
     키워드라 테마별 자산이 없고(기존 Canvas/currentColor 규약과 같은 이유)
     라이트/다크에서 accent 색이 자동으로 따라온다. hover(8%)는 색 온도가
     다르므로 그대로 둔다 — hover 와 선택이 색으로도 구분된다. */
  .sidebar button[aria-selected="true"] {
    background: color-mix(in srgb, Highlight 14%, transparent);
    font-weight: 600;
  }
  .sidebar button:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .sidebar button:focus-visible { outline: 2px solid Highlight; outline-offset: -2px; }

  /* ⭐ 탭 아이콘(이슈 #40 ②) — 자산 파일 없는 **인라인 SVG 선화**다. 색을
     하드코딩하지 않고 `stroke: currentColor` 만 쓰므로 :root 의
     `color-scheme: light dark` 가 정한 전경색을 그대로 따라간다 — 라이트에서
     검정, 다크에서 흰 선화가 된다(index.html 의 `<svg class="app-icon">` 과
     같은 규약, 테마별 사본이 필요 없는 이유). 형태 어휘도 정본 아이콘과
     맞춘다: viewBox 24×24 · fill none · stroke-width 2(docs/dev/icons.md §2). */
  .tab-icon {
    width: 16px; height: 16px; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
    opacity: .7;
  }
  .sidebar button[aria-selected="true"] .tab-icon { opacity: 1; }

  .panel { flex: 1 1 auto; overflow-y: auto; padding: 20px 24px; }

  /* ⭐ UXR-07 (이슈 #79) — 탭 전환 패널 페이드 인. 감소 모션 지정 시
     transition 자체를 끈다(0ms). `[hidden]`(display:none) 에서는 transition 이
     켜지지 않으므로, JS 가 hidden 해제 직후 **인라인 opacity 0** 을 세팅하고
     한 프레임 뒤 지워 기존 값을 CSS 기본(1)로 돌려 전환을 건다 — CSS 기본은
     opacity 1 이라 JS 없는 정적 렌더에서도 즉시 보인다(수용 기준 ④). */
  .tabpanel { transition: opacity 110ms ease-in-out; }
  @media (prefers-reduced-motion: reduce) {
    .tabpanel { transition: none !important; }
  }
  /* ⭐ 상세 헤딩(이슈 #45) — 제목 좌측에 해당 탭의 아이콘을 표시한다. 아이콘은
     사이드바 탭 button 의 인라인 SVG 를 JS 가 `cloneNode` 로 복제해 넣는다
     (`mountTabHeadingIcons` 참고 — 마크업을 두 벌로 복제하지 않아 drift 가 없다).
     텍스트는 `applyStrings()` 가 h1 자체가 아니라 안의 `<span>` 에 채운다 —
     사이드바 라벨과 같은 이유(이슈 #40 ②, `textContent` 는 SVG 를 지운다). */
  .tabpanel h1 {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; margin: 0 0 14px;
  }
  /* 헤딩 아이콘은 지금 선택된 탭의 것이라 사이드바의 **선택 상태**와 같이
     완전 불투명하게 그린다(기본 `.tab-icon` 의 .7 은 사이드바 비선택 상태용). */
  .tabpanel h1 .tab-icon { opacity: 1; }

  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .checkbox-row { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .checkbox-row.disabled { opacity: .55; cursor: default; }

  select { font: inherit; }
  select:disabled { opacity: .45; cursor: not-allowed; }

  .hint { opacity: .65; font-size: 12px; margin: 2px 0 12px; }
  .hint.caps-alias-missing { opacity: 1; color: #c2410c; }
  .hint.why { font-style: italic; }
  .warn { color: color-mix(in srgb, orange 70%, CanvasText); font-size: 12px; margin: 4px 0; }

  /* ⭐ UXR-05 — 섹션 구분선 상하 여백 16 → 18px. 섹션 경계가 더 또렷하게. */
  hr { border: none; border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent); margin: 18px 0; }

  .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: color-mix(in srgb, currentColor 15%, transparent);
    margin-left: 4px;
  }

  /* ⭐ F-12 — 비활성화 확인의 위험 버튼. 되돌릴 수 없는 조작(§5-13)이라 accent
     와 구분되는 붉은 강조를 준다. */
  .danger {
    background: color-mix(in srgb, red 22%, Canvas);
    border: 1px solid color-mix(in srgb, red 60%, currentColor);
  }

  .preview { font-weight: 600; font-size: 14px; min-width: 64px; }

  /* ③ 문장 중간 삽입 렌더러 — 라벨 문장 뒤에 체크박스 여럿이 한 줄로 이어진다.
     `Caps lock + [팝업] = ◀▼▲▶` 류의 정본 사례는 Presets 탭(범위 밖)에만 있으므로
     여기서는 이 레이아웃 클래스만 재사용 가능하게 마련해 둔다. */
   .inline-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
   .inline-row label { display: inline-flex; align-items: center; gap: 4px; }

  /* ⭐ K5(이슈 #73) — 원격 데스크톱 제외 목록 편집기의 행. F-17 의 가변 목록
     편집기(buildKeyRemapRow)와 같은 컨트롤 유형이라 배치도 같은 자리다 — 입력이
     남는 공간을 채우고 삭제 버튼은 고정 폭. */
  .korean-excluded-row-inner input[type="text"] { flex: 1 1 260px; font: inherit; }
  .keyremap-row-remove { flex: none; }

  .warnings p { margin: 4px 0; }

  #notice {
    padding: 8px 12px;
    border-radius: 6px;
    background: color-mix(in srgb, currentColor 10%, transparent);
    margin-bottom: 14px;
    font-size: 12px;
  }

  #general-path-info { margin: 10px 0 2px; padding: 8px 12px; border-radius: 6px;
    background: color-mix(in srgb, currentColor 6%, transparent); }
  #general-path-info p { margin: 2px 0; word-break: break-all; }

  /* ⭐ 이슈 #47 — 로그인 시 실행 행의 버전 버튼을 우측 끝으로 정렬한다(원본
     실측 "첫 행 우측", preferences-ui.md §4.4). .row 가 flex 이므로
     margin-left: auto 한 줄로 동작하고, 체크박스 라벨 길이가 달라져도 유지된다. */
  #version-btn { margin-left: auto; }

  button {
    font: inherit;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    background: color-mix(in srgb, currentColor 6%, transparent);
    color: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: color-mix(in srgb, currentColor 12%, transparent); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* ⭐ UXR-03 (이슈 #79) — accent(액션) 버튼: 시스템 강조색 채움. macOS 기본
     (action) 버튼 관례를 따른다. 글자색은 accent 위 대비를 위해 CanvasText
     를 흰 쪽(라이트)에 가깝게 color-mix 로 당긴다 — Highlight 밝기에 대한
     명시적 보정(제안식). hover 시 한 단계 진하게(채움 88% → Highlight 100%).
     ⛔ .danger(비활성화 확인)는 기존 붉은 스타일을 유지하고 accent 와 섞지
     않는다 — accent 가 danger 와 함께 붙은 버튼은 accent 채움이 무효화된다. */
  button.accent:not(.danger) {
    font-weight: 600;
    border-color: color-mix(in srgb, Highlight 60%, CanvasText);
    background: color-mix(in srgb, Highlight 88%, Canvas);
    color: color-mix(in srgb, CanvasText 10%, white);
  }
  button.accent:not(.danger):hover:not(:disabled) { background: Highlight; }

  /* ⭐ UXR-08 (이슈 #79) — 단축키 레코더를 필드형(캡슐) 컨트롤로. 버튼 요소·
     id·이벤트(`startSeekRecording`)·라벨은 그대로 두고 표면 스타일만 일반
     버튼과 구분한다. 레코딩 중(aria-pressed="true")은 accent 테두리/채움으로
     "지금 입력을 받는 중"을 즉시 알린다(라벨은 카탈로그 키라 무변경). */
  #seek-shortcut-record {
    padding: 5px 16px;
    border-radius: 7px;
    background: color-mix(in srgb, currentColor 4%, transparent);
    border-color: color-mix(in srgb, currentColor 25%, transparent);
    min-width: 150px;
    font-variant-numeric: tabular-nums;
  }
  #seek-shortcut-record[aria-pressed="true"] {
    background: color-mix(in srgb, Highlight 12%, transparent);
    border-color: Highlight;
    font-weight: 600;
  }

  /* ⭐ UXR-02 (이슈 #79) — 공용 focus-visible 규약. 버튼·탭·목록 행에 동일한
     포커스 링을 준다. :where() 로 이 규칙의 특이성을 0 으로 두어, 사이드바
     탭의 기존 전용 규칙(outline-offset -2px)이 우선 유지된다. 체크박스·select·
     range 는 이 선택자에 걸리지 않아 WebKit 네이티브 포커스 링을 유지한다
     (macOS 접근성 순응). 마우스 클릭 시(:focus)에는 드러나지 않게 :focus-visible 만. */
  :where(button, [role="tab"], [role="option"]):focus-visible {
    outline: 2px solid Highlight;
    outline-offset: 1px;
  }

  h2.group {
    /* ⭐ UXR-04 — 대문자 변환 제거 + color-mix 55% 대비. 한글 헤딩에서
       text-transform 은 무의미하고, opacity .6 은 다크에서 대비가 약했다.
       라이트/다크가 같은 강도가 되도록 opacity 대신 color 로 대비를 건다. */
    font-size: 12px; font-weight: 600;
    letter-spacing: .04em;
    color: color-mix(in srgb, currentColor 55%, transparent);
    margin: 4px 0 8px;
  }

  input[type="range"] { width: 200px; }

  /* Keyboards 탭 — 디바이스 선택 좌측 패인(이슈 #31 ④, Karabiner 식 배치).
     ⛔ 창 크기는 이 변경 범위 밖(이슈 #32) — 패인 폭만 좁게 고정하고 넘치는
     내용은 패인 안에서만 세로 스크롤한다. 다른 색과 마찬가지로 시스템 색
     (currentColor 기반 color-mix)만 쓴다 — 새 색을 하드코딩하지 않는다. */
  .keyboards-layout { display: flex; gap: 14px; align-items: flex-start; }
  .keyboards-device-pane {
    width: 190px;
    flex: 0 0 auto;
    max-height: 380px;
    overflow-y: auto;
    border: 1px solid color-mix(in srgb, currentColor 12%, transparent);
    border-radius: 6px;
    padding: 4px;
  }
  .keyboards-device-pane [role="option"] {
    display: block;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .keyboards-device-pane [role="option"]:hover {
    background: color-mix(in srgb, currentColor 8%, transparent);
  }
  .keyboards-device-pane [role="option"][aria-selected="true"] {
    background: color-mix(in srgb, Highlight 14%, transparent);
    font-weight: 600;
  }
  .keyboards-device-pane .device-name { display: block; }
  .keyboards-device-pane .device-ids { display: block; opacity: .6; font-size: 11px; }
  .keyboards-detail-pane { flex: 1 1 auto; min-width: 0; }
  .fkey-item { margin-bottom: 2px; }

  /* ⭐ 이슈 #46 — 그룹 제목 행(복사 버튼·상태 뱃지를 제목 옆에 붙인다). 새 색을
      하드코딩하지 않고 기존 규약(currentColor 기반 color-mix)만 쓴다. */
  .group-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .group-title-row h2.group { margin: 4px 0; }
  .group-title-row .badge { margin-left: 0; }

  /* ⭐ 이슈 #69 K1 — 컨텍스트 헤더. 우측 패인이 지금 어느 대상(공통/개별)의
     설정인지 최상단에 고정 표시한다. 공통 계층일 때는 공통 소속임을, 디바이스
     계층일 때는 제품명을 보여 준다. 패인 폭이 좁아 들여쓰기만으로 계층을
     구분하기 어렵다는 이슈 #69 지적의 정면 대응이다. */
  .keyboards-context {
    margin: 0 0 10px;
    padding: 6px 10px;
    border-left: 3px solid color-mix(in srgb, currentColor 35%, transparent);
    background: color-mix(in srgb, currentColor 7%, transparent);
    font-weight: 600;
    font-size: 13px;
  }

  /* ⭐ 이슈 #69 K1 — 상태 뱃지의 소속 강도. 상속 중(공통 따름)은 옅게, 이
     키보드 전용 값이 있으면 굵게 — 같은 pill 모양이라 위치·형식은 안 바뀌고
     강도만 계층을 따라간다(새 색 없이 currentColor 농도만 다르다). */
  .badge.state-inherited { opacity: .75; }
  .badge.state-override { font-weight: 700; }

  /* 충돌 대화상자 오버레이 — 창 안에서만 뜨는 모달. */
  #conflict-overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, CanvasText 35%, transparent);
  }
  #conflict-overlay .dialog {
    background: Canvas; color: CanvasText; border-radius: 10px; padding: 18px 20px;
    max-width: 420px; box-shadow: 0 8px 32px color-mix(in srgb, CanvasText 30%, transparent);
  }
  #conflict-overlay h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  #conflict-overlay p { margin: 0 0 8px; }
  #conflict-overlay ul { margin: 0 0 14px; padding-left: 18px; opacity: .75; font-size: 12px; }
  #conflict-overlay .dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; }

  /* ⭐ 이슈 #46 — 복사 확인 오버레이(D7). conflict-overlay 와 같은 .dialog 구조·
     색 규약이지만 Presets 충돌(서버 pendingConflict)과 달리 순수 프런트 확인이라
     전용 블록을 둔다 — 같은 오버레이에 두 계약을 얹지 않는다. */
  #confirm-overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, CanvasText 35%, transparent);
  }
  #confirm-overlay .dialog {
    background: Canvas; color: CanvasText; border-radius: 10px; padding: 18px 20px;
    max-width: 420px; box-shadow: 0 8px 32px color-mix(in srgb, CanvasText 30%, transparent);
  }
  #confirm-overlay h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  #confirm-overlay p { margin: 0 0 8px; }
  #confirm-overlay .dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- 카탈로그를 가져오는 경로 자체가 죽었을 때만 쓰는 최후 수단 화면(index.html 과
     동일한 방어적 부트스트랩 규약). 정상 경로에서는 항상 hidden. -->
<div id="fatal" hidden>
  <h1>Ultrakey</h1>
  <p id="fatal-body"></p>
</div>

<div class="shell" id="shell">
  <!-- ⭐ 탭 목록 — main.rs 의 KNOWN_TABS 화이트리스트와 항상 양방향으로 일치해야
       한다(`tests::every_tab_in_settings_html_is_a_known_tab`, 이슈 #28 회귀 방지).
       원본 SuperKey 는 탭마다 창을 리사이즈하지만(preferences-ui.md §3.1·§3.3),
       이 클론은 이슈 #32 Phase 1 부터 **단일 크기로 고정**하기로 했다 — 탭 전환은
       더 이상 창 크기를 바꾸지 않는다. 창의 기본 크기는 tauri.conf.json 의
       settings 창 선언(825×821 — main.rs SETTINGS_WINDOW_DEFAULT 주석에 근거를
       실측해 두었다)이 정하고, 사용자가 드래그로 조절한 크기는 F-15 저장 키
       ui.windowWidth/ui.windowHeight 로 영속화되어 다음 실행 때 복원된다. -->
  <nav class="sidebar" role="tablist" aria-orientation="vertical" id="tablist">
    <!-- ⭐ 아이콘은 라벨 왼쪽 인라인 SVG 다(이슈 #40 ②). 원본 SuperKey v1.66 도

  // ⭐ 이슈 #45 — 상세 헤딩 제목 좌측에 해당 탭의 아이콘을 표시한다. 사이드바

  // 원천으로 유지**해 양쪽이 조용히 갈라지는 drift 를 막는다(앱 아이콘의
  // 정본-대조 재발 방지 테스트에 해당하는 장치가 탭 아이콘에는 없다).
  // 사이드바 button 은 정적 HTML 이라 부팅 시점부터 항상 존재한다. 6탭 전부
  // 부착한다 — Seek·Hyperkey 도 브랜드인 것은 문자열 라벨뿐이고 아이콘은
  // 번역 대상이 아니므로 예외가 아니다. 가드: 이미 붙은 헤딩은 건너뛴다
  // (언어 변경 재렌더 때마다 이 함수가 다시 불려도 중복 부착이 없다).
  function mountTabHeadingIcons() {
    for (const name of TABS) {
      const heading = $(`${name}-heading`);
      if (heading.querySelector("svg")) continue;
      const icon = $(`tab-${name}`).querySelector("svg.tab-icon");
      heading.prepend(icon.cloneNode(true));

  }

        // 명시한다, keycode.rs 참고). 그래서 카탈로그를 거치지 않고 그대로 쓴다.

  // 번역하지 않는다. 지금 UI 를 못 읽는 사람도 이 목록에서는 자기 언어를 찾을
  // 수 있어야 하기 때문이다 — 목록을 프런트에 하드코딩하지 않는 것도 같은
  // 이유(로케일이 늘 때 여기와 백엔드 두 곳을 고쳐야 하는 drift 를 막는다).

  // 새겨진 표기이지 번역할 UI 문구가 아니므로 Rust 가 준 `label` 을 그대로 쓴다
  // (populateSourceSelects 의 같은 판단). 반대로 서술형 항목(`nothing (disable it)` 류,
  // 스킴 이름, ⌘ 변형)은 Rust 가 `labelKey` 를 함께 주고 여기서 카탈로그를 거친다.
