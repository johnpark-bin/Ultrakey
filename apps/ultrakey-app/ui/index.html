<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ultrakey</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 28px 32px;
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    /* ⭐ 불투명 배경 — `transparent` 는 tauri.conf.json 의 창 설정에
       `transparent: true` 가 없는 한 아무 효과가 없고(창 자체가 불투명하게
       합성된다), 렌더가 실패했을 때 창이 "텅 비어 보이는" 실패 모드를 더
       나쁘게 만들 뿐이다. 시스템 색을 써서 라이트/다크를 `color-scheme`
       설정에 맞춰 자동으로 따라가게 한다. */
    background: Canvas;
    color: CanvasText;
  }
  /* 앱 아이콘(이슈 #16). `stroke: currentColor` 라서 `color-scheme: light dark`
     가 정한 전경색을 그대로 따라간다 — 라이트에서는 검정 선화, 다크에서는 흰
     선화가 된다. 굵기·둥근 끝은 정본(assets/app-icon/ultrakey.svg)과 같은 값이다. */
  .app-icon {
    display: block;
    width: 44px;
    height: 44px;
    margin: 0 0 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .88;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
  p { margin: 0 0 14px; }
  .path {
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 7px;
    background: color-mix(in srgb, currentColor 8%, transparent);
  }
  .hint { opacity: .65; font-size: 12px; }
  pre.steps {
    white-space: pre-wrap;
    font: inherit;
    margin: 0 0 14px;
    padding: 10px 12px;
    border-radius: 7px;
    background: color-mix(in srgb, currentColor 8%, transparent);
  }
  .row { display: flex; gap: 8px; margin-top: 18px; }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    background: color-mix(in srgb, currentColor 6%, transparent);
    color: inherit;
    cursor: pointer;
  }
  button.primary { font-weight: 500; }
  button:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <!-- ⭐ 앱 아이콘. 사용자가 Ultrakey 에서 처음 보는 화면이라 여기에 둔다.
       `<img src="...">` 가 아니라 **인라인 SVG** 인 이유: (1) `currentColor` 로
       라이트/다크가 자동 대응된다, (2) 추가 네트워크 요청도 CSP 경계도 타지
       않는다, (3) 이 파일이 이미 안고 있는 "실패해도 화면에 보이게" 원칙과
       맞는다 — 외부 리소스 로드가 조용히 실패해 아이콘만 사라지는 경로가 없다.
       path 의 `d` 는 정본 `assets/app-icon/ultrakey.svg` 와 한 글자도 다르지 않다.
       어긋나면 tests/frontend_wiring.rs 가 잡는다. -->
  <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M7 3C7 3 10 3.5 12 3.5C14 3.5 17 3 17 3L18 12C18 12 15 13 12 13C9 13 6 12 6 12L7 3Z"/>
    <path d="M3.86857 8.14702L3.00694 18.4411C2.97634 18.8067 3.04731 19.1735 3.21208 19.5016L3.40935 19.8944C3.74963 20.572 4.44521 21 5.2061 21H18.7939C19.5548 21 20.2504 20.572 20.5907 19.8944L20.7879 19.5016C20.9527 19.1735 21.0237 18.8067 20.9931 18.4411L20.1314 8.14702C20.0687 7.39755 19.795 6.68086 19.3418 6.0792L17 3C17 3 14 3.5 12 3.5C10 3.5 6.97782 3 6.97782 3L4.65822 6.0792C4.20498 6.68086 3.9313 7.39755 3.86857 8.14702Z"/>
    <path d="M6 12L3.5 20M18 12L20.5 20"/>
  </svg>

  <h1 id="title"></h1>
  <p id="body"></p>

  <!-- 온보딩 경로 -->
  <div id="onboarding" hidden>
    <p class="path" id="path"></p>
    <p id="checkbox-hint"></p>
    <p class="hint" id="locked-hint"></p>
    <div class="row">
      <button class="primary" id="open">…</button>
    </div>
  </div>

  <!-- ⭐ 권한 어긋남(out of sync) 경로. 수동 절차만 안내한다 —
       자동 TCC 리셋은 permissions-onboarding.md §3.3·§7 이 채택하지 않기로 판정했다. -->
  <div id="out-of-sync" hidden>
    <pre class="steps" id="manual-steps"></pre>
    <div class="row">
      <button id="quit">…</button>
    </div>
  </div>

<script type="module">
// ⭐ 방어적 부트스트랩. 이 파일이 백지로 뜬 실제 사고 원인은
// `window.__TAURI__` 가 주입되지 않아(tauri.conf.json 에 `withGlobalTauri`
// 가 없었다) 모듈 평가 시점에 TypeError 가 나서 render() 가 한 번도 실행되지
// 못한 것이었다 — 실패가 화면에 전혀 드러나지 않았다. 이번 수정의 요지는
// "실패해도 창이 눈에 보이게" 이다: __TAURI__ 부재, render() 예외,
// 리스너 등록 실패, focus 재렌더 예외를 전부 잡아 화면에 진단 문구를 낸다.
//
// 아래 영어 하드코딩 문구는 D4("문자열은 전부 카탈로그에서")와 충돌하지
// 않는다 — 이것은 제품 문구가 아니라 오류 경로다. modal_copy 커맨드가
// 돌려주는 카탈로그 문구 자체를 가져오는 경로가 죽었을 때 쓰는 최후
// 수단이므로, 카탈로그에 기댈 수 없다.
const $ = (id) => document.getElementById(id);

function showDiagnostic(reason) {
  const title = $("title");
  const body = $("body");
  if (title) title.textContent = "Ultrakey";
  if (body) body.textContent = reason;
  const onboarding = $("onboarding");
  const outOfSync = $("out-of-sync");
  if (onboarding) onboarding.hidden = true;
  if (outOfSync) outOfSync.hidden = true;
}

const tauri = window.__TAURI__;
if (!tauri || !tauri.core) {
  showDiagnostic("Failed to load: window.__TAURI__ is unavailable (check withGlobalTauri in tauri.conf.json).");
} else {
  const { invoke } = tauri.core;

  async function render() {
    try {
      const c = await invoke("modal_copy");

      $("title").textContent = c.title;
      $("body").textContent = c.body;

      const onboarding = c.kind === "onboarding";
      $("onboarding").hidden = !onboarding;
      $("out-of-sync").hidden = onboarding;

      if (onboarding) {
        $("path").textContent = c.path;
        $("checkbox-hint").textContent = c.checkbox_hint;
        $("locked-hint").textContent = c.locked_hint;
        $("open").textContent = c.open_button;
      } else {
        $("manual-steps").textContent = c.manual_steps;
        $("quit").textContent = c.quit;
      }
    } catch (err) {
      showDiagnostic("Failed to render: " + String(err));
    }
  }

  try {
    const openBtn = $("open");
    if (openBtn) openBtn.addEventListener("click", () => invoke("open_settings"));
    const quitBtn = $("quit");
    if (quitBtn) quitBtn.addEventListener("click", () => invoke("quit_app"));
  } catch (err) {
    showDiagnostic("Failed to wire buttons: " + String(err));
  }

  // 사용자가 시스템 설정에서 돌아왔을 때 문구가 최신 상태를 반영하도록 다시 그린다.
  // (권한 부여 자체는 Rust 쪽 폴링이 감지해 이 창을 숨긴다 — F-11 §8:
  //  "별도의 확인 버튼 클릭 없이 폴링만으로 자동 진행된다")
  // render() 자체가 이미 자기 예외를 잡으므로, 여기서는 예외가 focus 리스너
  // 밖으로 새어나가 이후 render 호출 전부를 막는 일이 없게만 감싼다.
  window.addEventListener("focus", () => {
    try {
      render();
    } catch (err) {
      showDiagnostic("Failed to render: " + String(err));
    }
  });
  render();
}
</script>
</body>
</html>
