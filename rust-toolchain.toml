# ⭐ rustup 디렉터리 고정 (2026-09-26) — 이 디렉터리의 어떤 셸에서 `cargo` 를 호출하든
# 툴체인이 같게 만든다. 두 가지 실패를 구조적으로 막는다:
#
# 1. **rustup 기본 툴체인이 의존성 그래프의 MSRV(1.88+)를 못 넘는 문제** —
#    이 머신의 기본값이 1.85.0 이었을 때 오버라이드 없는 터미널에서
#    `scripts/build-signed.sh` 를 돌리면 icu·time 계열이 `requires rustc 1.88`
#    로 resolution 단계에서 실패한다(실측 2026-09-26). 자동화 셸과 사용자
#    터미널이 서로 다른 cargo 로 같은 `target/` 를 건드리면 지문이 어긋나
#    `E0463: can't find crate for \`zerofrom_derive\`` 류의 유령 오류가 남는다
#    (`docs/dev/code-signing.md` §4).
# 2. universal 빌드 타깃(`docs/spec/platform-constraints.md` §3.6)을 선언해
#    `rustup target add` 를 잊는 사고를 막는다 — rustup 이 이 파일의 타깃을
#    자동 설치한다(CI runner 의 기본 상태에도 무해).
#
# 기각한 대안: `scripts/build-signed.sh` 안에 버전 가드를 넣는 안 — 스크립트를
# 타지 않는 `cargo test`·`cargo clippy` 경로가 동일 함정에 빠지고, rustup 의
# 공식 고정 수단이 이미 존재하기 때문이다.
[toolchain]
channel = "stable"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
